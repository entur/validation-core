syntax = "proto3";

package entur.zagar.v1;

import "entur/http/v1/failure.proto";
import "entur/validation/v1/enum.proto";
import "entur/validation/v1/validation_job.proto";
import "entur/validation/v1/validation_progress.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/entur/validation-core/gen/entur/zagar/v1;zagarv1";
option java_multiple_files = true;
option java_package = "no.entur.zagar.proto.v1";

// The gRPC service to view validation jobs and their results.
service ValidationJobService {
  option (google.api.default_host) = "zagar.entur.io";

  // List validation jobs.
  //
  // The request is paginated with a default page size of 100.
  rpc ListValidationJobs(ListValidationJobsRequest) returns (ListValidationJobsResponse) {
    option (google.api.http) = {get: "/validation/v1/jobs"};
    option (gnostic.openapi.v3.operation) = {summary: "List validation jobs."};
  }

  // Get one validation job by its id.
  rpc GetValidationJob(GetValidationJobRequest) returns (entur.validation.v1.ValidationJob) {
    option (google.api.http) = {get: "/validation/v1/jobs/{validation_job}"};
    option (gnostic.openapi.v3.operation) = {summary: "Get one validation job by its id."};
    option (entur.http.v1.failure) = {
      code: "404"
      description: "No validation job exists with the given id."
    };
  }

  // List the rule-by-rule results of a validation job, across every stage. Each result carries
  // its own rule-attributed findings; dataset-wide findings with no rule to attribute them to are
  // instead on that stage's entry in GetValidationJob's `stages`.
  //
  // The request is paginated with a default page size of 100.
  rpc ListResults(ListResultsRequest) returns (ListResultsResponse) {
    option (google.api.http) = {get: "/validation/v1/jobs/{validation_job}/results"};
    option (gnostic.openapi.v3.operation) = {summary: "List the rule-by-rule results of a validation job."};
    option (entur.http.v1.failure) = {
      code: "404"
      description: "No validation job exists with the given id."
    };
  }

  // List how well each area scored in a validation job, from 0 to 100. An area is scored on the
  // rules it includes that ran in the job, directly or through a rule set, as they were scoped
  // when the job was scored. Failing rules lower the score by the weight of their worst finding's
  // severity (CRITICAL 10, ERROR 5, WARNING 1, INFO 0), out of what every rule the area ran could
  // lose: its default severity's weight, or its worst finding's when that is higher. A rule counts
  // once however many findings it has. The score is then
  // capped by the area's worst finding: 0 for CRITICAL, at most 59 for ERROR and at most 89 for
  // WARNING. No findings, or only INFO ones, scores 100.
  //
  // Empty until every stage of the job is complete and the job has been scored. A dry run is
  // never scored.
  rpc ListAreaScores(ListAreaScoresRequest) returns (ListAreaScoresResponse) {
    option (google.api.http) = {get: "/validation/v1/jobs/{validation_job}/area-scores"};
    option (gnostic.openapi.v3.operation) = {summary: "List how well each area scored in a validation job."};
    option (entur.http.v1.failure) = {
      code: "404"
      description: "No validation job exists with the given id."
    };
  }
}

// Request for ListValidationJobs.
message ListValidationJobsRequest {
  // The cursor to resume listing from, as returned by a previous call's cursor.
  string cursor = 1 [(gnostic.openapi.v3.property) = {
    example: {yaml: "\"eyJpZCI6NDJ9\""}
  }];
  // The maximum number of validation jobs to return. The default page size is 100.
  optional int32 page_size = 2 [(gnostic.openapi.v3.property) = {
    example: {yaml: "20"}
  }];
  // A comma-separated list of fields to order by, each optionally suffixed with " desc"
  // for descending order (ascending is the default). See https://google.aip.dev/132. Field names
  // are camelCase, e.g. "statistics.lastProgressReceivedAt", not the proto's own snake_case field
  // names. Supported fields: statistics.lastProgressReceivedAt (the default, desc),
  // statistics.firstProgressReceivedAt, statistics.isComplete, statistics.totalRules,
  // statistics.completedRules, statistics.skippedRules, statistics.overallSuccess,
  // statistics.worstSeverity, validationJob. The middle two are unset until the first finding is
  // recorded - sorting by either always places a job without one yet last, regardless of
  // direction. validationJob is always implicitly appended as a final tie-break regardless of
  // whether it's named explicitly.
  string order_by = 3 [(gnostic.openapi.v3.property) = {
    example: {yaml: "\"statistics.lastProgressReceivedAt desc\""}
  }];
  // Only return jobs whose overall `statistics.is_complete` matches this value. Unset returns
  // both completed and still-running jobs.
  optional bool is_complete = 4;
}

// Response for ListValidationJobs.
message ListValidationJobsResponse {
  // The validation jobs in this page of results.
  repeated entur.validation.v1.ValidationJob items = 1;
  // The cursor to pass to a subsequent call to continue listing. Empty
  // when there are no more results.
  string cursor = 2 [(gnostic.openapi.v3.property) = {
    example: {yaml: "\"eyJpZCI6NjJ9\""}
  }];
}

// Request for GetValidationJob.
message GetValidationJobRequest {
  // The id of the validation job to look up.
  string validation_job = 1 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "\"b6e43c3a-2e3e-4c5a-8f1a-2f6a6e1c9d3b\""}
    }
  ];
}

// Request for ListResults.
message ListResultsRequest {
  // The id of the validation job to list results for.
  string validation_job = 1 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "\"b6e43c3a-2e3e-4c5a-8f1a-2f6a6e1c9d3b\""}
    }
  ];
  // The cursor to resume listing from, as returned by a previous call's cursor.
  string cursor = 2 [(gnostic.openapi.v3.property) = {
    example: {yaml: "\"eyJpZCI6NDJ9\""}
  }];
  // The maximum number of results to return. The default page size is 100.
  optional int32 page_size = 3 [(gnostic.openapi.v3.property) = {
    example: {yaml: "20"}
  }];
  // A comma-separated list of fields to order by, each optionally suffixed with " desc"
  // for descending order (ascending is the default). See https://google.aip.dev/132. Field names
  // are camelCase, e.g. "startTime", not the proto's own snake_case field names. Supported fields:
  // startTime (the default), endTime, incomplete, fullResultUrl. The last is only set when
  // `incomplete` is - sorting by it always places a result without one last, regardless of direction.
  string order_by = 4 [(gnostic.openapi.v3.property) = {
    example: {yaml: "\"startTime\""}
  }];
}

// Response for ListResults.
message ListResultsResponse {
  // The rule-by-rule results in this page.
  repeated entur.validation.v1.RuleResult items = 1;
  // The cursor to pass to a subsequent call to continue listing. Empty
  // when there are no more results.
  string cursor = 2 [(gnostic.openapi.v3.property) = {
    example: {yaml: "\"eyJpZCI6NjJ9\""}
  }];
}

// Request for ListAreaScores.
message ListAreaScoresRequest {
  // The id of the validation job to list area scores for.
  string validation_job = 1 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "\"b6e43c3a-2e3e-4c5a-8f1a-2f6a6e1c9d3b\""}
    }
  ];
}

// Response for ListAreaScores.
message ListAreaScoresResponse {
  // The score of each area with at least one rule that ran in the job, ordered by area id.
  repeated AreaScore items = 1;
}

// How well one area scored in a validation job.
message AreaScore {
  // The kittum database id of the area.
  int32 area_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "7"}
    }
  ];
  // The score from 0 to 100, where 100 means no rule of the area found anything above INFO.
  int32 score = 2 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      minimum: 0
      maximum: 100
      example: {yaml: "82"}
    }
  ];
  // The most severe finding of the area's rules. Unset when they found nothing.
  optional entur.validation.v1.Severity worst_severity = 3 [(gnostic.openapi.v3.property) = {
    example: {yaml: "\"WARNING\""}
  }];
  // The number of the area's rules that ran in the job.
  int32 total_rules = 4 [(gnostic.openapi.v3.property) = {
    example: {yaml: "12"}
  }];
  // The number of the area's rules that found something above INFO.
  int32 failed_rules = 5 [(gnostic.openapi.v3.property) = {
    example: {yaml: "2"}
  }];
  // The number of CRITICAL findings of the area's rules. A truncated rule result only counts the
  // findings it carries.
  int32 critical_findings = 6;
  // The number of ERROR findings of the area's rules.
  int32 error_findings = 7;
  // The number of WARNING findings of the area's rules.
  int32 warning_findings = 8 [(gnostic.openapi.v3.property) = {
    example: {yaml: "5"}
  }];
  // The number of INFO findings of the area's rules.
  int32 info_findings = 9;
  // When the area was scored.
  google.protobuf.Timestamp scored_at = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
}
