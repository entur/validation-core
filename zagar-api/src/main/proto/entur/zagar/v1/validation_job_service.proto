syntax = "proto3";

package entur.zagar.v1;

import "entur/http/v1/failure.proto";
import "entur/validation/v1/enum.proto";
import "entur/validation/v1/validation_job.proto";
import "entur/validation/v1/validation_progress.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";

option go_package = "github.com/entur/validation-core/gen/entur/zagar/v1;zagarv1";
option java_multiple_files = true;
option java_package = "no.entur.zagar.proto.v1";

// The gRPC service to view validation jobs and their results.
service ValidationJobService {
  option (google.api.default_host) = "zagar.entur.io";

  // List validation jobs.
  //
  // The request is paginated with a default page size of 100.
  rpc ListValidationJobs(ListValidationJobsRequest) returns (ListValidationJobsResponse) {
    option (google.api.http) = {get: "/validation/v1/jobs"};
    option (gnostic.openapi.v3.operation) = {summary: "List validation jobs."};
  }

  // Get one validation job by its id.
  rpc GetValidationJob(GetValidationJobRequest) returns (entur.validation.v1.ValidationJob) {
    option (google.api.http) = {get: "/validation/v1/jobs/{validation_job_uuid}"};
    option (gnostic.openapi.v3.operation) = {summary: "Get one validation job by its id."};
    option (entur.http.v1.failure) = {
      code: "404"
      description: "No validation job exists with the given id."
    };
  }

  // List the rule-by-rule results of a validation job. Each result carries its own
  // rule-attributed findings; dataset-wide findings with no rule to attribute them to are on the
  // job itself (see GetValidationJob).
  //
  // The request is paginated with a default page size of 100.
  rpc ListResults(ListResultsRequest) returns (ListResultsResponse) {
    option (google.api.http) = {get: "/validation/v1/jobs/{validation_job_uuid}/results"};
    option (gnostic.openapi.v3.operation) = {summary: "List the rule-by-rule results of a validation job."};
    option (entur.http.v1.failure) = {
      code: "404"
      description: "No validation job exists with the given id."
    };
  }
}

// Request for ListValidationJobs.
message ListValidationJobsRequest {
  // The cursor to resume listing from, as returned by a previous call's cursor.
  string cursor = 1 [(gnostic.openapi.v3.property) = {
    example: {yaml: "\"eyJpZCI6NDJ9\""}
  }];
  // The maximum number of validation jobs to return. The default page size is 100.
  optional int32 page_size = 2 [(gnostic.openapi.v3.property) = {
    example: {yaml: "20"}
  }];
  // A comma-separated list of fields to order by, each optionally suffixed with " desc"
  // for descending order (ascending is the default). See https://google.aip.dev/132.
  // Defaults to "last_progress_received_at desc".
  string order_by = 3 [(gnostic.openapi.v3.property) = {
    example: {yaml: "\"last_progress_received_at desc\""}
  }];
  // Only return jobs whose `is_complete` matches this value. Unset returns both completed and
  // still-running jobs.
  optional bool is_complete = 4;
  // Only return jobs for this stage. Unset (VALIDATION_STAGE_UNSPECIFIED) returns every stage.
  entur.validation.v1.ValidationStage stage = 5 [(gnostic.openapi.v3.property) = {
    example: {yaml: "\"STRUCTURAL\""}
  }];
}

// Response for ListValidationJobs.
message ListValidationJobsResponse {
  // The validation jobs in this page of results.
  repeated entur.validation.v1.ValidationJob items = 1;
  // The cursor to pass to a subsequent call to continue listing. Empty
  // when there are no more results.
  string cursor = 2 [(gnostic.openapi.v3.property) = {
    example: {yaml: "\"eyJpZCI6NjJ9\""}
  }];
}

// Request for GetValidationJob.
message GetValidationJobRequest {
  // The id of the validation job to look up.
  string validation_job_uuid = 1 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "\"b6e43c3a-2e3e-4c5a-8f1a-2f6a6e1c9d3b\""}
    }
  ];
}

// Request for ListResults.
message ListResultsRequest {
  // The id of the validation job to list results for.
  string validation_job_uuid = 1 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "\"b6e43c3a-2e3e-4c5a-8f1a-2f6a6e1c9d3b\""}
    }
  ];
  // The cursor to resume listing from, as returned by a previous call's cursor.
  string cursor = 2 [(gnostic.openapi.v3.property) = {
    example: {yaml: "\"eyJpZCI6NDJ9\""}
  }];
  // The maximum number of results to return. The default page size is 100.
  optional int32 page_size = 3 [(gnostic.openapi.v3.property) = {
    example: {yaml: "20"}
  }];
  // A comma-separated list of fields to order by, each optionally suffixed with " desc"
  // for descending order (ascending is the default). See https://google.aip.dev/132.
  // Defaults to "started_at".
  string order_by = 4 [(gnostic.openapi.v3.property) = {
    example: {yaml: "\"started_at\""}
  }];
}

// Response for ListResults.
message ListResultsResponse {
  // The rule-by-rule results in this page.
  repeated entur.validation.v1.RuleResult items = 1;
  // The cursor to pass to a subsequent call to continue listing. Empty
  // when there are no more results.
  string cursor = 2 [(gnostic.openapi.v3.property) = {
    example: {yaml: "\"eyJpZCI6NjJ9\""}
  }];
}
