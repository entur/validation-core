version: v2
plugins:
  # See validation-model/buf.gen.yaml for why protoc_builtin is used here
  # instead of a standalone plugin binary. Test-fixtures only (src/test/proto)
  # - see the bufGenerate task in build.gradle.kts for why this isn't part of
  # the root buf.yaml workspace like the other modules' src/main/proto.
  - protoc_builtin: java
    protoc_path: protoc
    out: proto-utils/build/generated/source/proto/test/java
  - protoc_builtin: kotlin
    protoc_path: protoc
    out: proto-utils/build/generated/source/proto/test/kotlin
