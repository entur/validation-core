syntax = "proto3";
package no.entur.proto.testfixtures.v1;

import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "no.entur.proto.testfixtures.v1";

message Widget {
  int64 id = 1 [(google.api.field_behavior) = IDENTIFIER];
  string name = 2;
  google.protobuf.Timestamp updated_at = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  WidgetStatus status = 4;
  repeated Part parts = 5;
}

enum WidgetStatus {
  WIDGET_STATUS_UNSPECIFIED = 0;
  WIDGET_STATUS_ACTIVE = 1;
  WIDGET_STATUS_INACTIVE = 2;
}

message Part {
  int64 id = 1 [(google.api.field_behavior) = IDENTIFIER];
  string label = 2;
  Detail detail = 3;
}

message Detail {
  string generated_note = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string value = 2;
}

// No IDENTIFIER/OUTPUT_ONLY fields at all - a message with neither convention applied.
message Note {
  string message = 1;
}

// updated_at is missing the OUTPUT_ONLY annotation - a schema bug. Covers ResourceFields' invariant
// check that an id/updated_at-shaped resource must annotate updated_at as OUTPUT_ONLY.
message MalformedWidget {
  int64 id = 1 [(google.api.field_behavior) = IDENTIFIER];
  string updated_at = 2;
}
