syntax = "proto3";

package entur.kittum.query.v1;

import "entur/http/v1/failure.proto";
import "entur/validation/v1/enum.proto";
import "entur/validation/v1/validation_rule.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";

option go_package = "github.com/entur/validation-core/gen/entur/kittum/query/v1;kittumqueryv1";
option java_multiple_files = true;
option java_package = "no.entur.kittum.query.proto.v1";

// The gRPC service runtime consumers, such as misharum, use to read what to validate with. It is
// read-only and deliberately separate from the kittum.v1 API that kittum's frontend manages rules
// through, so that API can grow without every runtime consumer having to follow.
service ValidationQueryService {
  option (google.api.default_host) = "kittum.entur.io";

  // List every validation rule for one stage that an area assigned to the given payload type
  // includes, either directly or through one of the area's rule sets. A rule reached more than
  // once is returned once.
  rpc ListValidationRulesForStage(ListValidationRulesForStageRequest) returns (ListValidationRulesForStageResponse) {
    option (google.api.http) = {get: "/validation/v1/query/payload-types/{payload_type}/rules/{stage}"};
    option (gnostic.openapi.v3.operation) = {summary: "List all validation rules for a given stage and payload type."};
    option (entur.http.v1.failure) = {
      code: "400"
      description: "The stage is `VALIDATION_STAGE_UNSPECIFIED` or not a known stage."
    };
    option (entur.http.v1.failure) = {
      code: "404"
      description: "The payload type does not exist."
    };
  }

  // Get one validation rule by its id.
  rpc GetValidationRule(GetValidationRuleRequest) returns (entur.validation.v1.ValidationRule) {
    option (google.api.http) = {get: "/validation/v1/query/rules/{id}"};
    option (gnostic.openapi.v3.operation) = {summary: "Get one validation rule by its id."};
    option (entur.http.v1.failure) = {
      code: "400"
      description: "The id is not a valid integer."
    };
    option (entur.http.v1.failure) = {
      code: "404"
      description: "No validation rule exists with the given id, including zero or a negative id."
    };
  }

  // List the areas each of the given validation rules is scoped to, either directly or through one
  // of the area's rule sets. An area reaching a rule more than once is listed once for it. A rule
  // that doesn't exist is left out of the response, and a rule in no area is returned with no
  // area ids, so a caller can tell the two apart.
  rpc ListAreasForRules(ListAreasForRulesRequest) returns (ListAreasForRulesResponse) {
    option (google.api.http) = {get: "/validation/v1/query/rule-areas"};
    option (gnostic.openapi.v3.operation) = {summary: "List the areas each of the given validation rules is scoped to."};
    option (entur.http.v1.failure) = {
      code: "400"
      description: "No rule id is given, or one is not a valid integer."
    };
  }
}

// Request for GetValidationRule.
message GetValidationRuleRequest {
  // The database id of the validation rule to lookup.
  int32 id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "1"}
    }
  ];
}

// Request for ListValidationRulesForStage.
message ListValidationRulesForStageRequest {
  // The stage to get validation rules for. `VALIDATION_STAGE_UNSPECIFIED` is not a valid stage here.
  //
  // This field is case insensitive.
  entur.validation.v1.ValidationStage stage = 1 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "\"STRUCTURAL\""}
    }
  ];
  // The name of the payload type to get validation rules for, as carried by
  // ValidationDelivery.payload_type.
  string payload_type = 2 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "\"rutedata\""}
    }
  ];
}

// Response for ListValidationRulesForStage.
message ListValidationRulesForStageResponse {
  // The validation rules for the requested stage and payload type, in no particular order.
  repeated entur.validation.v1.ValidationRule validation_rules = 1 [(gnostic.openapi.v3.property) = {
    example: {yaml: "[{\"id\": 1, \"defaultSeverity\": \"ERROR\", \"stage\": \"STRUCTURAL\", \"name\": \"netex-xsd\", \"description\": \"Validates the file against its XSD.\", \"owner\": 2}]"}
  }];
}

// Request for ListAreasForRules.
message ListAreasForRulesRequest {
  // The database ids of the validation rules to list areas for.
  repeated int32 rule_ids = 1 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      min_items: 1
      example: {yaml: "[1, 2]"}
    }
  ];
}

// Response for ListAreasForRules.
message ListAreasForRulesResponse {
  // The areas of each requested validation rule that exists, in no particular order.
  repeated RuleAreas rule_areas = 1 [(gnostic.openapi.v3.property) = {
    example: {yaml: "[{\"ruleId\": 1, \"areas\": [{\"id\": 7, \"name\": \"Rutedata\"}, {\"id\": 9, \"name\": \"Holdeplasser\"}]}, {\"ruleId\": 2, \"areas\": []}]"}
  }];
}

// The areas one validation rule is scoped to.
message RuleAreas {
  // The database id of the validation rule.
  int32 rule_id = 1 [(google.api.field_behavior) = REQUIRED];
  // The areas the rule is scoped to, directly or through a rule set. Empty when the rule is in no
  // area.
  repeated AreaRef areas = 2;
}

// An area a validation rule is scoped to.
message AreaRef {
  // The database id of the area.
  int32 id = 1 [(google.api.field_behavior) = REQUIRED];
  // The area's name, as it is when the request is answered.
  string name = 2 [(google.api.field_behavior) = REQUIRED];
}
