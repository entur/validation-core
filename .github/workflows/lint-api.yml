name: lint-api

# specs/ is generated, so fix a finding here in the .proto and rebuild.
on:
  pull_request:
    paths: ["specs/**"]

jobs:
  api-lint:
    if: github.actor != 'dependabot[bot]'
    strategy:
      matrix:
        spec: ["specs/kittum.yaml", "specs/zagar.yaml"]
      fail-fast: false
    uses: entur/gha-api/.github/workflows/lint.yml@v6
    secrets: inherit
    with:
      path: ${{ matrix.spec }}
      fail_threshold: error
      # The services implementing these APIs own their registry entries.
      upload_to_bucket: false
