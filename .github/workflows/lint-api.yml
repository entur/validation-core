name: lint-api

# Lints the generated OpenAPI specs against Entur's API guidelines
# (entur/api-guidelines, applied by entur/gha-api via spectral).
#
# The specs under specs/ are generated from the .proto files, so a guideline
# problem reported here is a problem in the schema: fix the .proto and rebuild.
on:
  pull_request:
    paths: ["specs/**"]

jobs:
  api-lint:
    if: github.actor != 'dependabot[bot]'
    strategy:
      matrix:
        spec: ["specs/kittum.yaml"]
      fail-fast: false
    uses: entur/gha-api/.github/workflows/lint.yml@v6
    secrets: inherit
    with:
      path: ${{ matrix.spec }}
      fail_threshold: error
      # This repository publishes libraries; it does not serve an API. The
      # application that actually implements the API owns that spec in the central registry.
      upload_to_bucket: false
