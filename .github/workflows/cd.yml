name: CD

# Publishes libraries to Entur's JFrog Artifactory when a v<major>.<minor>.<patch> tag is pushed.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  publish:
    if: github.repository == 'entur/validation-core'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.73.0"

      - uses: arduino/setup-protoc@v3
        with:
          version: "36.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to JFrog Artifactory
        uses: entur/gha-artifactory/.github/actions/maven-publish@v1
        with:
          version: ${{ steps.version.outputs.version }}
        env:
          ARTIFACTORY_AUTH_USER: ${{ secrets.ARTIFACTORY_AUTH_USER }}
          ARTIFACTORY_AUTH_TOKEN: ${{ secrets.ARTIFACTORY_AUTH_TOKEN }}

  notify:
    needs: [publish]
    if: always() && github.repository == 'entur/validation-core'
    uses: entur/gha-slack/.github/workflows/post.yml@v3
    with:
      channel_id: "team-validering"
      message: >-
        ${{ needs.publish.result == 'success'
        && format(':white_check_mark: validation-core {0} published to Artifactory', github.ref_name)
        || format(':x: validation-core {0} publish failed: {1}/{2}/actions/runs/{3}', github.ref_name, github.server_url, github.repository, github.run_id) }}
    secrets: inherit
