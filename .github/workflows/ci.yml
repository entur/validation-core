name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.73.0"

      - uses: arduino/setup-protoc@v3
        # protoc_builtin plugins make buf shell out to protoc on PATH.
        with:
          version: "36.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: buf lint
        run: buf lint

      - name: buf format
        # Fails if a committed .proto file isn't formatted per `buf format -w`.
        run: buf format --diff --exit-code

      - name: Check for updated buf-breaking-change label
        id: buf-breaking-label
        if: github.event_name == 'pull_request'
        # Queried live: github.event.pull_request.labels misses labels added after the trigger.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --json labels --jq '.labels[].name' | grep -qx "buf-breaking-change"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: buf breaking
        # No-ops on a push to main. Skip with the 'buf-breaking-change' label when the
        # break is intentional and consumers are coordinated.
        if: steps.buf-breaking-label.outputs.skip != 'true'
        uses: bufbuild/buf-breaking-action@v1
        with:
          input: "."
          against: "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git#branch=main"

      - name: Build and test
        # Also regenerates specs/, checked below.
        run: ./gradlew build

      - name: Test build logic
        # buildSrc is a separate build; `./gradlew build` doesn't run its tests.
        run: ./gradlew :buildSrc:test

      - name: Verify generated OpenAPI specs are committed
        run: git diff --exit-code -- specs/