name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.73.0"

      - uses: arduino/setup-protoc@v3
        # buf.gen.yaml uses protoc_builtin for java/kotlin (see comments
        # there) - buf shells out to protoc on PATH for those instead of a
        # standalone plugin binary.
        with:
          version: "36.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: buf lint
        run: buf lint

      - uses: bufbuild/buf-breaking-action@v1
        # Catches field renumbering/removal in either module immediately.
        # No-ops on a push to main (comparing a ref against itself).
        with:
          input: "."
          against: "https://github.com/${{ github.repository }}.git#branch=main"

      - name: Build and test
        run: ./gradlew build
