name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.73.0"

      - uses: arduino/setup-protoc@v3
        # buf.gen.yaml uses protoc_builtin for java/kotlin (see comments
        # there) - buf shells out to protoc on PATH for those instead of a
        # standalone plugin binary.
        with:
          version: "36.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: buf lint
        run: buf lint

      - name: buf format
        # Fails if any .proto file isn't formatted per `buf format -w`.
        run: buf format --diff --exit-code

      - name: buf breaking
        # Catches field renumbering/removal in either module immediately.
        # No-ops on a push to main (comparing a ref against itself).
        # Skip by adding the 'buf-breaking-change' label to the PR when the
        # break is intentional and consumers are coordinated.
        if: "!contains(github.event.pull_request.labels.*.name, 'buf-breaking-change')"
        uses: bufbuild/buf-breaking-action@v1
        with:
          input: "."
          against: "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git#branch=main"

      - name: Build and test
        # Each API module's processResources depends on its copyOpenApiSpec, so
        # this regenerates every committed spec under specs/ from the
        # current .proto files.
        run: ./gradlew build

      - name: Verify generated OpenAPI specs are committed
        run: git diff --exit-code -- specs/