                                $ref: '#/components/schemas/ProblemDetail'
                '409':
                    description: A different payload type with the new name already
                        exists, or the `If-Match` header does not match the payload
                        type's current ETag.
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ProblemDetail'
    /validation/v1/payload-types/{payloadType}/flows/{stage}:
        get:
            tags:
              - ValidationFlowService
            summary: List the flows connected to a payload type for one stage, across
                every area.
            description: |-
                List every validation flow connected to a payload type for one stage, across every area
                 that has one assigned. Each returned flow is deep: every rule and sub-flow item it
                 contains, recursively, carries both the database id of what it refers to and the
                 referred-to ValidationRule/ValidationFlow itself.
            operationId: ValidationFlowService_ListPayloadTypeFlows
            parameters:
              - name: payloadType
                in: path
                description: The name of the payload type to list flows for.
                required: true
                schema:
                    type: string
              - name: stage
                in: path
                description: |-
                    The stage of the flows to list.

                     This field is case insensitive.
                required: true
                schema:
                    enum:
                      - VALIDATION_STAGE_UNSPECIFIED
                      - STRUCTURAL
                      - LOCAL
                      - GLOBAL
                    type: string
                    format: enum
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListPayloadTypeFlowsResponse'
                '404':
                    description: The payload type does not exist.
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ProblemDetail'
    /validation/v1/payload-types/{payloadType}/flows/{stage}/{area}:
        get:
            tags:
              - ValidationFlowService
            summary: Get the flow connected to a payload type, for one stage and area.
            description: |-
                Get the validation flow connected to a payload type, for one stage and area.
                 The returned flow is deep: every rule and sub-flow item it contains,
                 recursively, carries both the database id of what it refers to and the
                 referred-to ValidationRule/ValidationFlow itself.
            operationId: ValidationFlowService_GetPayloadTypeFlow
            parameters:
              - name: payloadType
                in: path
                description: The name of the payload type to lookup.
                required: true
                schema:
                    type: string
              - name: stage
                in: path
                description: |-
                    The stage of the flow to lookup.

                     This field is case insensitive.
                required: true
                schema:
                    enum:
                      - VALIDATION_STAGE_UNSPECIFIED
                      - STRUCTURAL
                      - LOCAL
                      - GLOBAL
                    type: string
                    format: enum
              - name: area
                in: path
                description: The name of the area to lookup.
                required: true
                schema:
                    type: string
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationFlow'
                '404':
                    description: The payload type or area does not exist, or no flow
                        is connected for the given stage and area.
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ProblemDetail'
        post:
            tags:
              - ValidationFlowService
            summary: Assign a validation flow to a payload type, for one stage and
                area.
            description: |-
                Assign a validation flow to a payload type, for one stage and area. At most one flow may
                 be assigned to a given (payload_type, stage, area) slot: this fails if the slot already
                 has a flow assigned - call UnassignPayloadTypeFlow first to reassign it. `flow_id` must
                 reference an existing ValidationFlow whose own `stage` matches the request's `stage`.
            operationId: ValidationFlowService_AssignPayloadTypeFlow
            parameters:
              - name: payloadType
                in: path
                description: The name of the payload type to assign the flow to.
                required: true
                schema:
                    type: string
              - name: stage
                in: path
                description: |-
                    The stage of the slot to assign the flow to.

                     This field is case insensitive.
                required: true
                schema:
                    enum:
                      - VALIDATION_STAGE_UNSPECIFIED
                      - STRUCTURAL
                      - LOCAL
                      - GLOBAL
                    type: string
                    format: enum
              - name: area
                in: path
                description: The name of the area of the slot to assign the flow to.
                required: true
                schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AssignPayloadTypeFlowRequest'
                required: true
            responses:
                '200':
                    description: OK
                    content: {}
                '404':
                    description: The payload type or area does not exist.
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ProblemDetail'
                '400':
                    description: The validation flow referenced by `flow_id` does
                        not exist, or has a `stage` that does not match the request's
                        `stage`.
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ProblemDetail'
                '409':
                    description: The (payload_type, stage, area) slot already has
                        a flow assigned.
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ProblemDetail'
        delete:
            tags:
              - ValidationFlowService
            summary: Unassign the flow connected to a payload type, for one stage
                and area.
            description: Unassign the validation flow connected to a payload type,
                for one stage and area.
            operationId: ValidationFlowService_UnassignPayloadTypeFlow
            parameters:
              - name: payloadType
                in: path
                description: The name of the payload type to unassign the flow from.
                required: true
                schema:
                    type: string
              - name: stage
                in: path
                description: |-
                    The stage of the slot to unassign the flow from.

                     This field is case insensitive.
                required: true
                schema:
                    enum:
                      - VALIDATION_STAGE_UNSPECIFIED
                      - STRUCTURAL
                      - LOCAL
                      - GLOBAL
                    type: string
                    format: enum
              - name: area
                in: path
                description: The name of the area of the slot to unassign the flow
                    from.
                required: true
                schema:
                    type: string
            responses:
                '200':
                    description: OK
                    content: {}
                '404':
                    description: The payload type or area does not exist, or no flow
                        is connected for the given stage and area.
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ProblemDetail'
    /validation/v1/rules:
        get:
            tags:
              - ValidationRuleService
            summary: List existing validation rules.
            description: |-
                List existing validation rules.

                 The request is paginated with a default page size of 100.
            operationId: ValidationRuleService_ListValidationRules
            parameters:
              - name: cursor
                in: query
                description: The cursor to resume listing from, as returned by a previous
                    call's cursor.
                schema:
                    type: string
              - name: pageSize
                in: query
                description: The maximum number of validation rules to return. The
                    default page size is 100.
                schema:
                    type: integer
                    format: int32
              - name: orderBy
                in: query
                description: |-
                    A comma-separated list of fields to order by, each optionally suffixed with " desc"
                     for descending order (ascending is the default). See https://google.aip.dev/132.
                schema:
                    type: string
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListValidationRulesResponse'
        post:
            tags:
              - ValidationRuleService
            summary: Create a new validation rule.
            description: |-
                Create a new validation rule. Exactly one field of its `rule` oneof must be set. Its
                 `id` and `updated_at` are OUTPUT_ONLY and ignored if set; the server assigns both.
                 Returns the full created rule, including its server-assigned `id` and `updated_at`.
            operationId: ValidationRuleService_CreateValidationRule
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ValidationRule'
                required: true
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationRule'
    /validation/v1/rules/{id}:
        get:
            tags:
              - ValidationRuleService
            summary: Get one validation rule by its id.
            description: Get one validation rule by its id.
            operationId: ValidationRuleService_GetValidationRule
            parameters:
              - name: id
                in: path
                description: The database id of the validation rule to lookup.
                required: true
                schema:
                    type: integer
                    format: int32
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationRule'
                '404':
                    description: No validation rule exists with the given id.
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ProblemDetail'
        delete:
            tags:
              - ValidationRuleService
            summary: Delete a validation rule.
            description: |-
                Delete a validation rule. Over REST, this is a conditional request: it requires a
                 matching `If-Match` request header and fails with 409 Conflict (not the RFC
                 7232-standard 412, which Entur's API guidelines don't allow) if it no longer matches
                 the rule's current `ETag`, e.g. because another update happened concurrently. This is
                 an HTTP-layer precondition, not a field of DeleteValidationRuleRequest.
            operationId: ValidationRuleService_DeleteValidationRule
            parameters:
              - name: id
                in: path
                description: The database id of the validation rule to delete.
                required: true
                schema:
                    type: integer
                    format: int32
            responses:
                '200':
                    description: OK
                    content: {}
                '404':
                    description: No validation rule exists with the given id.
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ProblemDetail'
                '409':
                    description: The `If-Match` header does not match the rule's current
                        ETag, or the validation rule is still referenced by a validation
                        flow item.
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ProblemDetail'
        patch:
            tags:
              - ValidationRuleService
            summary: Update an existing validation rule.
            description: |-
                Update an existing validation rule. Its `id`, if set, must match the path `id`.
                 The `rule` oneof's set field is immutable: it must be the same variant (e.g. `xsd_rule`)
                 as the rule's current type, and the request fails with INVALID_ARGUMENT if it is not -
                 changing a rule's type requires deleting it and creating a new one. Returns the full
                 updated rule, with its new `updated_at`. Over REST, this is a conditional request: it
                 requires a matching `If-Match` request header and fails with 409 Conflict (not the RFC
                 7232-standard 412, which Entur's API guidelines don't allow) if it no longer matches
                 the rule's current `ETag`, e.g. because another update happened concurrently. This is
                 an HTTP-layer precondition, not a field of UpdateValidationRuleRequest.
            operationId: ValidationRuleService_UpdateValidationRule
            parameters:
              - name: id
                in: path
                description: The database id of the validation rule to update.
                required: true
                schema:
                    type: integer
                    format: int32
              - name: updateMask
                in: query
                description: |-
                    The fields of `validation_rule` to update. Fields populated in `validation_rule` but not
                     listed here are left unchanged. Omitting this mask updates every field of `validation_rule`.
                     Setting this mask to an empty value updates all non-empty fields of `validation_rule`. The
                     special value `*` is equivalent to omitting the mask: full replacement, as if this were a PUT.
                schema:
                    type: string
                    format: field-mask
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ValidationRule'
                required: true
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationRule'
                '404':
                    description: No validation rule exists with the given id.
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ProblemDetail'
                '400':
                    description: The `rule` oneof's set field does not match the rule's
                        current type.
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ProblemDetail'
                '409':
                    description: The `If-Match` header does not match the rule's current
                        ETag.
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ProblemDetail'
components:
    schemas:
        Area:
            required:
              - name
              - owner
            type: object
            properties:
                id:
                    example: 1
                    type: integer
                    description: The database id of the area.
                    format: int32
                name:
                    example: Personalisering
                    type: string
                    description: The name of the area.
                owner:
                    example: 2
                    type: integer
                    description: The database id of the owner of the area.
                    format: int32
                updatedAt:
                    readOnly: true
                    example: '2026-01-01T00:00:00Z'
                    type: string
                    description: |-
                        The timestamp the area was last updated. Always populated by the server; a value set by
                         the client is ignored, not an error.
                    format: date-time
            description: A specific area that is interested in validating certain
                deliveries. Owned by exactly one Owner.
            example:
                id: 1
                name: Personalisering
                owner: 2
                updatedAt: '2026-01-01T00:00:00Z'
        AssignPayloadTypeFlowRequest:
            required:
              - payloadType
              - stage
              - area
              - flowId
            type: object
            properties:
                payloadType:
                    example: rutedata
                    type: string
                    description: The name of the payload type to assign the flow to.
                stage:
                    example: STRUCTURAL
                    enum:
                      - VALIDATION_STAGE_UNSPECIFIED
                      - STRUCTURAL
                      - LOCAL
                      - GLOBAL
                    type: string
                    description: |-
                        The stage of the slot to assign the flow to.

                         This field is case insensitive.
                    format: enum
                area:
                    example: Personalisering
                    type: string
                    description: The name of the area of the slot to assign the flow
                        to.
                flowId:
                    example: 1
                    type: integer
                    description: |-
                        The database id of the validation flow to assign. Must be an existing flow whose own
                         `stage` matches this request's `stage`.
                    format: int32
            description: Request for AssignPayloadTypeFlow.
            example:
                payloadType: rutedata
                stage: STRUCTURAL
                area: Personalisering
                flowId: 1
        FieldViolation:
            description: One request field that failed validation.
            required:
              - field
              - message
            type: object
            properties:
                field:
                    type: string
                    description: The offending field, e.g. "name" or "items[2].severity_override".
                    example: name
                message:
                    type: string
                    description: A human-readable explanation of why this field is
                        invalid.
                    example: must not be blank
            example:
                field: name
                message: must not be blank
        FlowItem:
            type: object
            properties:
                id:
                    example: 1
                    type: integer
                    description: The database id of the flow item.
                    format: int32
                ruleFlowItem:
                    allOf:
                      - $ref: '#/components/schemas/RuleFlowItem'
                    description: A rule inside the flow.
                subFlowItem:
                    allOf:
                      - $ref: '#/components/schemas/SubFlowItem'
                    description: A flow inside the flow.
                updatedAt:
                    readOnly: true
                    example: '2026-01-01T00:00:00Z'
                    type: string
                    description: |-
                        The timestamp the flow item was last updated. Always populated by the server; a value
                         set by the client is ignored, not an error.
                    format: date-time
            description: One item in a ValidationFlow's ordered list.
            example:
                id: 1
                ruleFlowItem:
                    id: 1
                    validationRule:
                        id: 1
                        area: 7
                        defaultSeverity: ERROR
                        stage: STRUCTURAL
                        name: netex-xsd
                        description: Validates the file against its XSD.
                        xsdRule:
                            message: File does not match its XSD.
                            xsdPath: xsd/netex/NeTEx_publication.xsd
                            fileFilter: .*\.xml
                        updatedAt: '2026-01-01T00:00:00Z'
                    severityOverride: WARNING
                updatedAt: '2026-01-01T00:00:00Z'
        ListAreasResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/Area'
                    description: The areas in this page of results.
                cursor:
                    example: eyJpZCI6NjJ9
                    type: string
                    description: |-
                        The cursor to pass to a subsequent call to continue listing. Empty
                         when there are no more results.
            description: Response for ListAreas.
            example:
                items:
                  - id: 1
                    name: Personalisering
                    owner: 2
                    updatedAt: '2026-01-01T00:00:00Z'
                cursor: eyJpZCI6NjJ9
        ListOwnersResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/Owner'
                    description: The owners in this page of results.
                cursor:
                    example: eyJpZCI6NjJ9
                    type: string
                    description: |-
                        The cursor to pass to a subsequent call to continue listing. Empty
                         when there are no more results.
            description: Response for ListOwners.
            example:
                items:
                  - id: 1
                    name: team-validering
                    updatedAt: '2026-01-01T00:00:00Z'
                cursor: eyJpZCI6NjJ9
        ListPayloadTypeFlowsResponse:
            type: object
            properties:
                items:
                    type: object
                    additionalProperties:
                        $ref: '#/components/schemas/ValidationFlow'
                    description: |-
                        Keyed by area name - one entry per area that has a flow assigned for the requested
                         (payload_type, stage). Area names are unique, so this loses no information relative to a list.
            description: Response for ListPayloadTypeFlows.
            example:
                items:
                    additionalProp1:
                        id: 1
                        name: netex-structural
                        description: Runs structural checks for NeTEx deliveries.
                        stage: STRUCTURAL
                        items:
                          - id: 1
                            ruleFlowItem:
                                id: 1
                                validationRule:
                                    id: 1
                                    area: 7
                                    defaultSeverity: ERROR
                                    stage: STRUCTURAL
                                    name: netex-xsd
                                    description: Validates the file against its XSD.
                                    xsdRule:
                                        message: File does not match its XSD.
                                        xsdPath: xsd/netex/NeTEx_publication.xsd
                                        fileFilter: .*\.xml
                                    updatedAt: '2026-01-01T00:00:00Z'
                                severityOverride: WARNING
                            updatedAt: '2026-01-01T00:00:00Z'
                        owner: 2
                        updatedAt: '2026-01-01T00:00:00Z'
        ListPayloadTypesResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/PayloadType'
                    description: The payload types in this page of results.
                cursor:
                    example: eyJpZCI6NjJ9
                    type: string
                    description: |-
                        The cursor to pass to a subsequent call to continue listing. Empty
                         when there are no more results.
            description: Response for ListPayloadTypes.
            example:
                items:
                  - id: 42
                    name: rutedata
                    owner: 3
                    updatedAt: '2026-01-01T00:00:00Z'
                cursor: eyJpZCI6NjJ9
        ListValidationFlowsResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/ValidationFlow'
                    description: The (shallow) flows in this page of results.
                cursor:
                    example: eyJpZCI6NjJ9
                    type: string
                    description: |-
                        The cursor to pass to a subsequent call to continue listing. Empty
                         when there are no more results.
            description: Response for ListValidationFlows.
            example:
                items:
                  - id: 1
                    name: netex-structural
                    description: Runs structural checks for NeTEx deliveries.
                    stage: STRUCTURAL
                    items:
                      - id: 1
                        ruleFlowItem:
                            id: 1
                            validationRule:
                                id: 1
                                area: 7
                                defaultSeverity: ERROR
                                stage: STRUCTURAL
                                name: netex-xsd
                                description: Validates the file against its XSD.
                                xsdRule:
                                    message: File does not match its XSD.
                                    xsdPath: xsd/netex/NeTEx_publication.xsd
                                    fileFilter: .*\.xml
                                updatedAt: '2026-01-01T00:00:00Z'
                            severityOverride: WARNING
                        updatedAt: '2026-01-01T00:00:00Z'
                    owner: 2
                    updatedAt: '2026-01-01T00:00:00Z'
                cursor: eyJpZCI6NjJ9
        ListValidationRulesResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/ValidationRule'
                    description: The validation rules in this page of results.
                cursor:
                    example: eyJpZCI6NjJ9
                    type: string
                    description: |-
                        The cursor to pass to a subsequent call to continue listing. Empty
                         when there are no more results.
            description: Response for ListValidationRules.
            example:
                items:
                  - id: 1
                    area: 7
                    defaultSeverity: ERROR
                    stage: STRUCTURAL
                    name: netex-xsd
                    description: Validates the file against its XSD.
                    xsdRule:
                        message: File does not match its XSD.
                        xsdPath: xsd/netex/NeTEx_publication.xsd
                        fileFilter: .*\.xml
                    updatedAt: '2026-01-01T00:00:00Z'
                cursor: eyJpZCI6NjJ9
        Owner:
            required:
              - name
            type: object
            properties:
                id:
                    example: 1
                    type: integer
                    description: The database id of the owner.
                    format: int32
                name:
                    example: team-validering
                    type: string
                    description: The name of the owner.
                updatedAt:
                    readOnly: true
                    example: '2026-01-01T00:00:00Z'
                    type: string
                    description: |-
                        The timestamp the owner was last updated. Always populated by the server; a value set by
                         the client is ignored, not an error.
                    format: date-time
            description: An owner of deliveries and areas, for example an Entur team.
            example:
                id: 1
                name: team-validering
                updatedAt: '2026-01-01T00:00:00Z'
        PayloadType:
            required:
              - name
              - owner
            type: object
            properties:
                id:
                    example: 42
                    type: integer
                    description: The database id of the payload type.
                    format: int32
                name:
                    example: rutedata
                    type: string
                    description: The name of the payload type.
                owner:
                    example: 3
                    type: integer
                    description: The database id of the owner of the payload type.
                    format: int32
                updatedAt:
                    readOnly: true
                    example: '2026-01-01T00:00:00Z'
                    type: string
                    description: |-
                        The timestamp the payload type was last updated. Always populated by the server; a value set
                         by the client is ignored, not an error.
                    format: date-time
            description: A named intake point for a set of files, owned by exactly
                one Owner.
            example:
                id: 42
                name: rutedata
                owner: 3
                updatedAt: '2026-01-01T00:00:00Z'
        ProblemDetail:
            description: RFC 9457 Problem Details for HTTP APIs.
            required:
              - title
              - status
            type: object
            properties:
                title:
                    type: string
                    description: A short, human-readable summary of the problem type.
                    example: Not Found
                status:
                    type: integer
                    format: int32
                    description: The HTTP status code.
                    example: 404
                detail:
                    type: string
                    description: A human-readable explanation specific to this occurrence.
                    example: No payload type exists with the name 'rutedata'.
                errors:
                    type: array
                    items:
                        $ref: '#/components/schemas/FieldViolation'
                    description: |-
                        Field-level validation errors that caused this problem, if any. This is an RFC 9457 extension
                         member; it is absent when the problem isn't a per-field validation failure.
            example:
                title: Not Found
                status: 404
                detail: No payload type exists with the name 'rutedata'.
                errors:
                  - field: name
                    message: must not be blank
        RuleFlowItem:
            type: object
            properties:
                id:
                    example: 1
                    type: integer
                    description: The database id of the ValidationRule this item runs.
                    format: int32
                validationRule:
                    readOnly: true
                    allOf:
                      - $ref: '#/components/schemas/ValidationRule'
                    description: |-
                        The full validation rule. Populated on a deep read (GetValidationFlow,
                         GetPayloadTypeFlow); absent on a shallow listing (ListValidationFlows).
                severityOverride:
                    example: WARNING
                    enum:
                      - SEVERITY_UNSPECIFIED
                      - CRITICAL
                      - ERROR
                      - WARNING
                      - INFO
                    type: string
                    description: If present, overrides the rule's own default_severity
                        for this inclusion only.
                    format: enum
            description: |-
                A flow item that runs one concrete ValidationRule, optionally overriding
                 its default severity for this inclusion only.
            example:
                id: 1
                validationRule:
                    id: 1
                    area: 7
                    defaultSeverity: ERROR
                    stage: STRUCTURAL
                    name: netex-xsd
                    description: Validates the file against its XSD.
                    xsdRule:
                        message: File does not match its XSD.
                        xsdPath: xsd/netex/NeTEx_publication.xsd
                        fileFilter: .*\.xml
                    updatedAt: '2026-01-01T00:00:00Z'
                severityOverride: WARNING
        SqlRule:
            required:
              - message
              - sqlExpression
              - cardinality
            type: object
            properties:
                message:
                    example: Data does not match the SQL statement.
                    type: string
                    description: The message to print if the validation rule fails.
                sqlExpression:
                    example: SELECT e.full_id FROM entities e WHERE e.entity_type='ServiceJourney'
                        AND e.wrapper_path='vehicleJourneys';
                    type: string
                    description: A SQL expression to run against the database. The
                        returned rows are checked against `cardinality` below.
                cardinality:
                    example: EXACTLY_ONE
                    enum:
                      - CARDINALITY_UNSPECIFIED
                      - NONE
                      - EXACTLY_ONE
                      - AT_LEAST_ONE
                      - EXACTLY_TWO
                    type: string
                    description: The cardinality the returned row set must resolve
                        to for the validation to succeed.
                    format: enum
            description: |-
                A validation rule that runs a SQL statement against a database. Stage is either LOCAL or GLOBAL.
                 (The database implementation and exact SQL language is intentionally undefined.)
            example:
                message: Data does not match the SQL statement.
                sqlExpression: SELECT e.full_id FROM entities e WHERE e.entity_type='ServiceJourney'
                    AND e.wrapper_path='vehicleJourneys';
                cardinality: EXACTLY_ONE
        SubFlowItem:
            type: object
            properties:
                id:
                    example: 1
                    type: integer
                    description: The database id of the flow to run.
                    format: int32
                flow:
                    readOnly: true
                    allOf:
                      - $ref: '#/components/schemas/ValidationFlow'
                    description: |-
                        The full flow. Populated on a deep read (GetValidationFlow,
                         GetPayloadTypeFlow), recursively for every sub-flow it contains in turn;
                         absent on a shallow listing (ListValidationFlows).
            description: |-
                A flow item that runs another ValidationFlow in its entirety, letting
                 flows be composed into a tree.
            example:
                id: 1
                flow:
                    id: 1
                    name: netex-structural
                    description: Runs structural checks for NeTEx deliveries.
                    stage: STRUCTURAL
                    items:
                      - id: 1
                        ruleFlowItem:
                            id: 1
                            validationRule:
                                id: 1
                                area: 7
                                defaultSeverity: ERROR
                                stage: STRUCTURAL
                                name: netex-xsd
                                description: Validates the file against its XSD.
                                xsdRule:
                                    message: File does not match its XSD.
                                    xsdPath: xsd/netex/NeTEx_publication.xsd
                                    fileFilter: .*\.xml
                                updatedAt: '2026-01-01T00:00:00Z'
                            severityOverride: WARNING
                        updatedAt: '2026-01-01T00:00:00Z'
                    owner: 2
                    updatedAt: '2026-01-01T00:00:00Z'
        ValidationFlow:
            required:
              - name
              - description
              - stage
              - owner
            type: object
            properties:
                id:
                    example: 1
                    type: integer
                    description: The database id of the validation flow.
                    format: int32
                name:
                    example: netex-structural
                    type: string
                    description: The name of the validation flow.
                description:
                    example: Runs structural checks for NeTEx deliveries.
                    type: string
                    description: A textual description of the validation flow.
                stage:
                    example: STRUCTURAL
                    enum:
                      - VALIDATION_STAGE_UNSPECIFIED
                      - STRUCTURAL
                      - LOCAL
                      - GLOBAL
                    type: string
                    description: |-
                        The stage the validation flow runs in. All items in the validation
                         flow must have the same stage.
                    format: enum
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/FlowItem'
                    description: The validation flow's items, in execution order.
                owner:
                    example: 2
                    type: integer
                    description: The database id of the owner of the validation flow.
                    format: int32
                updatedAt:
                    readOnly: true
                    example: '2026-01-01T00:00:00Z'
                    type: string
                    description: |-
                        The timestamp the validation flow was last updated. Always populated by the server; a
                         value set by the client is ignored, not an error.
                    format: date-time
            description: |-
                A named, ordered tree of validation rules. A validation flow belongs to
                 exactly one validation stage; every rule and sub-flow it contains must
                 belong to that same stage.
            example:
                id: 1
                name: netex-structural
                description: Runs structural checks for NeTEx deliveries.
                stage: STRUCTURAL
                items:
                  - id: 1
                    ruleFlowItem:
                        id: 1
                        validationRule:
                            id: 1
                            area: 7
                            defaultSeverity: ERROR
                            stage: STRUCTURAL
                            name: netex-xsd
                            description: Validates the file against its XSD.
                            xsdRule:
                                message: File does not match its XSD.
                                xsdPath: xsd/netex/NeTEx_publication.xsd
                                fileFilter: .*\.xml
                            updatedAt: '2026-01-01T00:00:00Z'
                        severityOverride: WARNING
                    updatedAt: '2026-01-01T00:00:00Z'
                owner: 2
                updatedAt: '2026-01-01T00:00:00Z'
        ValidationRule:
            required:
              - area
              - defaultSeverity
              - stage
              - name
              - description
            type: object
            properties:
                id:
                    example: 1
                    type: integer
                    description: The database id of the validation rule.
                    format: int32
                area:
                    example: 7
                    type: integer
                    description: The database id of the area that owns the validation
                        rule.
                    format: int32
                defaultSeverity:
                    example: ERROR
                    enum:
                      - SEVERITY_UNSPECIFIED
                      - CRITICAL
                      - ERROR
                      - WARNING
                      - INFO
                    type: string
                    description: The default severity of the validation rule.
                    format: enum
                stage:
                    example: STRUCTURAL
                    enum:
                      - VALIDATION_STAGE_UNSPECIFIED
                      - STRUCTURAL
                      - LOCAL
                      - GLOBAL
                    type: string
                    description: The stage the validation rule runs in.
                    format: enum
                name:
                    example: netex-xsd
                    type: string
                    description: The name of the validation rule.
                description:
                    example: Validates the file against its XSD.
                    type: string
                    description: A textual description of the validation rule.
                xsdRule:
                    allOf:
                      - $ref: '#/components/schemas/XsdRule'
                    description: An XSD rule.
                xpathRule:
                    allOf:
                      - $ref: '#/components/schemas/XPathRule'
                    description: An XPath rule.
                sqlRule:
                    allOf:
                      - $ref: '#/components/schemas/SqlRule'
                    description: A SQL rule.
                updatedAt:
                    readOnly: true
                    example: '2026-01-01T00:00:00Z'
                    type: string
                    description: |-
                        The timestamp the validation rule was last updated. Always populated by the server; a
                         value set by the client is ignored, not an error.
                    format: date-time
            description: A single validation rule, owned by one Area.
            example:
                id: 1
                area: 7
                defaultSeverity: ERROR
                stage: STRUCTURAL
                name: netex-xsd
                description: Validates the file against its XSD.
                xsdRule:
                    message: File does not match its XSD.
                    xsdPath: xsd/netex/NeTEx_publication.xsd
                    fileFilter: .*\.xml
                updatedAt: '2026-01-01T00:00:00Z'
        XPathRule:
            required:
              - message
              - xpathExpression
              - cardinality
            type: object
            properties:
                message:
                    example: File does not match the XPath expression.
                    type: string
                    description: The message to print if the validation rule fails.
                xpathExpression:
                    example: ServiceFrame[validityConditions or ValidBetween]
                    type: string
                    description: An XPath expression to run against the file. The
                        returned nodes are checked against `cardinality` below.
                cardinality:
                    example: EXACTLY_ONE
                    enum:
                      - CARDINALITY_UNSPECIFIED
                      - NONE
                      - EXACTLY_ONE
                      - AT_LEAST_ONE
                      - EXACTLY_TWO
                    type: string
                    description: The cardinality the expression must resolve to for
                        the validation to succeed.
                    format: enum
                fileFilter:
                    example: .*\.xml
                    type: string
                    description: A regexp a file's name must match to be processed
                        by this rule. Runs against every file when absent.
            description: A validation rule that runs an XPath expression against one
                or more XML files and checks the number of matches. Always stage LOCAL.
            example:
                message: File does not match the XPath expression.
                xpathExpression: ServiceFrame[validityConditions or ValidBetween]
                cardinality: EXACTLY_ONE
                fileFilter: .*\.xml
        XsdRule:
            required:
              - message
              - xsdPath
            type: object
            properties:
                message:
                    example: File does not match its XSD.
                    type: string
                    description: The message to print if the validation rule fails.
                xsdPath:
                    example: xsd/netex/NeTEx_publication.xsd
                    type: string
                    description: The path to the XSD, relative to some externally
                        configured root.
                fileFilter:
                    example: .*\.xml
                    type: string
                    description: A regexp a file's name must match to be processed
                        by this rule. Runs against every file when absent.
            description: A validation rule that checks a file against an XSD. Always
                stage STRUCTURAL.
            example:
                message: File does not match its XSD.
                xsdPath: xsd/netex/NeTEx_publication.xsd
                fileFilter: .*\.xml
