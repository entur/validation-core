tags:
  - name: OpenApi
    description: This service's own generated OpenAPI specification.
  - name: ParquetService
    description: |-
        The gRPC service to browse and query the Parquet files at the configured location. A copy
         of kittum-api's own ParquetService (ETU-80815), kept running there in parallel for a short
         while before kittum's copy is retired.
  - name: ValidationDataService
    description: The gRPC service to view the data ishum has seen and where each delivery
        is stored.
