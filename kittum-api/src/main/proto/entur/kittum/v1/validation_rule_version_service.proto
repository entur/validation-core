  // The version's new field values.
  entur.validation.v1.ValidationRule validation_rule = 3 [(google.api.field_behavior) = REQUIRED];
  // The fields of `validation_rule` to update, with the same meaning as in UpdateValidationRuleRequest.
  optional google.protobuf.FieldMask update_mask = 4;
}

