syntax = "proto3";

package entur.kittum.v1;

import "entur/validation/v1/owner.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";

option go_package = "github.com/entur/validation-core/gen/entur/kittum/v1;kittumv1";
option java_multiple_files = true;
option java_package = "no.entur.kittum.proto.v1";

// The gRPC service to view and administrate owners.
service OwnerService {
  option (google.api.default_host) = "kittum.entur.io";

  // List all existing owners.
  rpc ListOwners(ListOwnersRequest) returns (ListOwnersResponse) {
    option (google.api.http) = {get: "/v1/owners"};
    option (gnostic.openapi.v3.operation) = {summary: "List all existing owners."};
  }

  // Get one owner by its id.
  rpc GetOwner(GetOwnerRequest) returns (entur.validation.v1.Owner) {
    option (google.api.http) = {get: "/v1/owners/{id}"};
    option (gnostic.openapi.v3.operation) = {summary: "Get one owner by its id."};
  }

  // Create a new owner. Returns the full created owner, including its server-assigned `id`
  // and `updated_at`.
  rpc CreateOwner(CreateOwnerRequest) returns (entur.validation.v1.Owner) {
    option (google.api.http) = {
      post: "/v1/owners"
      body: "owner"
    };
    option (gnostic.openapi.v3.operation) = {summary: "Create a new owner."};
  }

  // Update an existing owner. Returns the full updated owner, with its new `updated_at`.
  rpc UpdateOwner(UpdateOwnerRequest) returns (entur.validation.v1.Owner) {
    option (google.api.http) = {
      patch: "/v1/owners/{id}"
      body: "owner"
    };
    option (gnostic.openapi.v3.operation) = {summary: "Update an existing owner."};
  }

  // Delete an owner.
  rpc DeleteOwner(DeleteOwnerRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/owners/{id}"};
    option (gnostic.openapi.v3.operation) = {summary: "Delete an owner."};
  }
}

// Request for ListOwners.
message ListOwnersRequest {}

// Response for ListOwners.
message ListOwnersResponse {
  // All existing owners.
  repeated entur.validation.v1.Owner items = 1;
}

// Request for GetOwner.
message GetOwnerRequest {
  // The database id of the owner to lookup.
  int32 id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "1"}
    }
  ];
}

// Request for CreateOwner.
message CreateOwnerRequest {
  // The owner to create. Its `id` and `updated_at` are ignored if set; the server assigns both.
  entur.validation.v1.Owner owner = 1 [(google.api.field_behavior) = REQUIRED];
}

// Request for UpdateOwner.
message UpdateOwnerRequest {
  // The database id of the owner to update.
  int32 id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "1"}
    }
  ];
  // The owner's new field values. Its `id`, if set, must match the `id` above. `updated_at`
  // is used as an etag: it must be set to the value last returned for this owner, and the
  // request fails with FAILED_PRECONDITION (412 Precondition Failed over REST) if it no
  // longer matches the owner's current `updated_at`, e.g. because another update happened
  // concurrently. On success, the server assigns a new `updated_at`.
  entur.validation.v1.Owner owner = 2 [(google.api.field_behavior) = REQUIRED];
  // The fields of `owner` to update. Fields populated in `owner` but not listed here are
  // left unchanged. Omitting this mask updates every field populated in `owner`.
  optional google.protobuf.FieldMask update_mask = 3;
}

// Request for DeleteOwner.
message DeleteOwnerRequest {
  // The database id of the owner to delete.
  int32 id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "1"}
    }
  ];
}
