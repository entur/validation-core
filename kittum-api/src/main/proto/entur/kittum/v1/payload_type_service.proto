syntax = "proto3";

package entur.kittum.v1;

import "entur/http/v1/failure.proto";
import "entur/validation/v1/payload_type.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";

option go_package = "github.com/entur/validation-core/gen/entur/kittum/v1;kittumv1";
option java_multiple_files = true;
option java_package = "no.entur.kittum.proto.v1";

// The gRPC service to view and administrate payload types.
service PayloadTypeService {
  option (google.api.default_host) = "kittum.entur.io";

  // List all existing payload types.
  //
  // The request is paginated with a default page size of 100.
  rpc ListPayloadTypes(ListPayloadTypesRequest) returns (ListPayloadTypesResponse) {
    option (google.api.http) = {get: "/validation/v1/payload-types"};
    option (gnostic.openapi.v3.operation) = {summary: "List all existing payload types."};
  }

  // Get one payload type by its name.
  rpc GetPayloadType(GetPayloadTypeRequest) returns (entur.validation.v1.PayloadType) {
    option (google.api.http) = {get: "/validation/v1/payload-types/{name}"};
    option (gnostic.openapi.v3.operation) = {summary: "Get one payload type by its name."};
    option (entur.http.v1.failure) = {
      code: "404"
      description: "No payload type exists with the given name."
    };
  }

  // Create a new payload type. Unlike Area/Owner, a payload type's `name` is chosen by the
  // caller and is its identifier; the request fails with ALREADY_EXISTS if it is already taken.
  // Its `id` and `updated_at` are OUTPUT_ONLY and ignored if set; the server assigns both.
  // Returns the full created payload type, including its server-assigned `id` and `updated_at`.
  rpc CreatePayloadType(CreatePayloadTypeRequest) returns (entur.validation.v1.PayloadType) {
    option (google.api.http) = {
      post: "/validation/v1/payload-types"
      body: "payload_type"
    };
    option (gnostic.openapi.v3.operation) = {summary: "Create a new payload type."};
    option (entur.http.v1.failure) = {
      code: "409"
      description: "A payload type with the given name already exists."
    };
  }

  // Update an existing payload type. Its `id`, if set, must match the payload type's own id.
  // Renaming a payload type is allowed by setting a different `name` in the body (and including
  // it in the update mask); later requests use the new name. Returns the full updated payload
  // type, with its new `updated_at`. Over REST, this is a conditional request: it requires a
  // matching `If-Match` request header and fails with 409 Conflict (not the RFC
  // 7232-standard 412, which Entur's API guidelines don't allow) if it no longer matches
  // the payload type's current `ETag`, e.g. because another update happened concurrently. This
  // is an HTTP-layer precondition, not a field of UpdatePayloadTypeRequest.
  rpc UpdatePayloadType(UpdatePayloadTypeRequest) returns (entur.validation.v1.PayloadType) {
    option (google.api.http) = {
      patch: "/validation/v1/payload-types/{name}"
      body: "payload_type"
    };
    option (gnostic.openapi.v3.operation) = {summary: "Update an existing payload type."};
    option (entur.http.v1.failure) = {
      code: "404"
      description: "No payload type exists with the given name."
    };
    option (entur.http.v1.failure) = {
      code: "409"
      description: "A different payload type with the new name already exists, or the `If-Match` header does not match the payload type's current ETag."
    };
  }

  // Delete a payload type. Over REST, this is a conditional request: it requires a matching
  // `If-Match` request header and fails with 409 Conflict (not the RFC 7232-standard 412,
  // which Entur's API guidelines don't allow) if it no longer matches the payload type's current
  // `ETag`, e.g. because another update happened concurrently. This is an HTTP-layer
  // precondition, not a field of DeletePayloadTypeRequest.
  rpc DeletePayloadType(DeletePayloadTypeRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/validation/v1/payload-types/{name}"};
    option (gnostic.openapi.v3.operation) = {summary: "Delete a payload type."};
    option (entur.http.v1.failure) = {
      code: "404"
      description: "No payload type exists with the given name."
    };
    option (entur.http.v1.failure) = {
      code: "409"
      description: "The `If-Match` header does not match the payload type's current ETag, or the payload type is still referenced by a payload type flow."
    };
  }
}

// Request for ListPayloadTypes.
message ListPayloadTypesRequest {
  // The cursor to resume listing from, as returned by a previous call's cursor.
  string cursor = 1 [(gnostic.openapi.v3.property) = {
    example: {yaml: "\"eyJpZCI6NDJ9\""}
  }];
  // The maximum number of payload types to return. The default page size is 100.
  optional int32 page_size = 2 [(gnostic.openapi.v3.property) = {
    example: {yaml: "20"}
  }];
  // A comma-separated list of fields to order by, each optionally suffixed with " desc"
  // for descending order (ascending is the default). See https://google.aip.dev/132.
  string order_by = 3 [(gnostic.openapi.v3.property) = {
    example: {yaml: "\"name\""}
  }];
}

// Response for ListPayloadTypes.
message ListPayloadTypesResponse {
  // The payload types in this page of results.
  repeated entur.validation.v1.PayloadType items = 1;
  // The cursor to pass to a subsequent call to continue listing. Empty
  // when there are no more results.
  string cursor = 2 [(gnostic.openapi.v3.property) = {
    example: {yaml: "\"eyJpZCI6NjJ9\""}
  }];
}

// Request for GetPayloadType.
message GetPayloadTypeRequest {
  // The name of the payload type to lookup.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "\"rutedata\""}
    }
  ];
}

// Request for CreatePayloadType.
message CreatePayloadTypeRequest {
  // The payload type to create.
  entur.validation.v1.PayloadType payload_type = 1 [(google.api.field_behavior) = REQUIRED];
}

// Request for UpdatePayloadType.
message UpdatePayloadTypeRequest {
  // The current name of the payload type to update.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "\"rutedata\""}
    }
  ];
  // The payload type's new field values.
  entur.validation.v1.PayloadType payload_type = 2 [(google.api.field_behavior) = REQUIRED];
  // The fields of `payload_type` to update. Fields populated in `payload_type` but not listed
  // here are left unchanged. Omitting this mask updates every field of `payload_type`. Setting
  // this mask to an empty value updates all non-empty fields of `payload_type`. The special
  // value `*` is equivalent to omitting the mask: full replacement, as if this were a PUT.
  optional google.protobuf.FieldMask update_mask = 3;
}

// Request for DeletePayloadType.
message DeletePayloadTypeRequest {
  // The name of the payload type to delete.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "\"rutedata\""}
    }
  ];
}
