syntax = "proto3";

package entur.kittum.v1;

import "entur/http/v1/failure.proto";
import "entur/validation/v1/validation_flow.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";

option go_package = "github.com/entur/validation-core/gen/entur/kittum/v1;kittumv1";
option java_multiple_files = true;
option java_package = "no.entur.kittum.proto.v1";

// The gRPC service to view and administrate the versions of validation flows.
//
// A flow has the same lifecycle as a rule, see ValidationRuleVersionService. A flow version
// pins exact rule versions, see RuleFlowItem.
service ValidationFlowVersionService {
  option (google.api.default_host) = "kittum.entur.io";

  // List every version of a validation flow, newest first, each with its own content and `version_info`. The request is paginated with a default page size of 100.
  rpc ListValidationFlowVersions(ListValidationFlowVersionsRequest) returns (ListValidationFlowVersionsResponse) {
    option (google.api.http) = {get: "/validation/v1/flows/{id}/versions"};
    option (gnostic.openapi.v3.operation) = {summary: "List the versions of a validation flow."};
    option (entur.http.v1.failure) = {
      code: "404"
      description: "No validation flow exists with the given id."
    };
  }

  // Get one version of a validation flow, with its content and `version_info`.
  rpc GetValidationFlowVersion(GetValidationFlowVersionRequest) returns (entur.validation.v1.ValidationFlow) {
    option (google.api.http) = {get: "/validation/v1/flows/{id}/versions/{version}"};
    option (gnostic.openapi.v3.operation) = {summary: "Get one version of a validation flow."};
    option (entur.http.v1.failure) = {
      code: "404"
      description: "No validation flow exists with the given id, or it has no such version."
    };
  }

  // Create a new DRAFT version of a validation flow as a copy of its ACTIVE version, numbered one higher than its latest version. The ACTIVE version keeps being served unchanged. Fails with 409 if the validation flow already has a version that is DRAFT, IN_REVIEW or SHADOW, or has no ACTIVE version to copy.
  rpc CreateValidationFlowVersion(CreateValidationFlowVersionRequest) returns (entur.validation.v1.ValidationFlow) {
    option (google.api.http) = {post: "/validation/v1/flows/{id}/versions"};
    option (gnostic.openapi.v3.operation) = {summary: "Create a new draft version of a validation flow."};
    option (entur.http.v1.failure) = {
      code: "404"
      description: "No validation flow exists with the given id."
    };
    option (entur.http.v1.failure) = {
      code: "409"
      description: "The validation flow already has a pending version, or has no ACTIVE version to copy."
    };
  }

  // Update a DRAFT version of a validation flow. Resets the version's dry-run count to zero. Over REST, this is a conditional request: it requires a matching `If-Match` request header and fails with 409 Conflict if it no longer matches the version's current `ETag`.
  rpc UpdateValidationFlowVersion(UpdateValidationFlowVersionRequest) returns (entur.validation.v1.ValidationFlow) {
    option (google.api.http) = {
      patch: "/validation/v1/flows/{id}/versions/{version}"
      body: "validation_flow"
    };
    option (gnostic.openapi.v3.operation) = {summary: "Update a draft version of a validation flow."};
    option (entur.http.v1.failure) = {
      code: "404"
      description: "No validation flow exists with the given id, or it has no such version."
    };
    option (entur.http.v1.failure) = {
      code: "409"
      description: "The version is not a DRAFT, or the `If-Match` header does not match its current ETag."
    };
  }

  // Delete a DRAFT version of a validation flow. Fails with 409 if the version is not a DRAFT or, for a rule, if a flow version still pins it. Deleting the only version deletes the validation flow.
  rpc DeleteValidationFlowVersion(DeleteValidationFlowVersionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/validation/v1/flows/{id}/versions/{version}"};
    option (gnostic.openapi.v3.operation) = {summary: "Delete a draft version of a validation flow."};
    option (entur.http.v1.failure) = {
      code: "404"
      description: "No validation flow exists with the given id, or it has no such version."
    };
    option (entur.http.v1.failure) = {
      code: "409"
      description: "The version is not a DRAFT."
    };
  }

  // Submit a DRAFT version of a validation flow for review. The version becomes IN_REVIEW and its content is frozen. It needs at least one dry-run. Every pinned rule version must be ACTIVE or DEPRECATED, every sub-flow must have an ACTIVE version, and the flow must contain at least one item. Fails with 409 if any of this is not met.
  rpc SubmitValidationFlowVersion(SubmitValidationFlowVersionRequest) returns (entur.validation.v1.ValidationFlow) {
    option (google.api.http) = {post: "/validation/v1/flows/{id}/versions/{version}/submit"};
    option (gnostic.openapi.v3.operation) = {summary: "Submit a draft version of a validation flow for review."};
    option (entur.http.v1.failure) = {
      code: "404"
      description: "No validation flow exists with the given id, or it has no such version."
    };
    option (entur.http.v1.failure) = {
      code: "409"
      description: "The version is not a DRAFT, has no dry-run, or a precondition on its items is not met."
    };
  }

  // Approve an IN_REVIEW version of a validation flow. This records the caller in `approved_by` and keeps the status IN_REVIEW. Start shadow and activate both need it. Fails with 403 if the caller is the version's author, and 409 if the version is not IN_REVIEW or is already approved.
  rpc ApproveValidationFlowVersion(ApproveValidationFlowVersionRequest) returns (entur.validation.v1.ValidationFlow) {
    option (google.api.http) = {post: "/validation/v1/flows/{id}/versions/{version}/approve"};
    option (gnostic.openapi.v3.operation) = {summary: "Approve a version of a validation flow that is in review."};
    option (entur.http.v1.failure) = {
      code: "404"
      description: "No validation flow exists with the given id, or it has no such version."
    };
    option (entur.http.v1.failure) = {
      code: "403"
      description: "The caller is the author of the version."
    };
    option (entur.http.v1.failure) = {
      code: "409"
      description: "The version is not IN_REVIEW, or is already approved."
    };
  }

  // Send an IN_REVIEW version of a validation flow back to DRAFT and clear its approval. Fails with 403 if the caller is the version's author, and 409 if the version is not IN_REVIEW.
  rpc RequestChangesValidationFlowVersion(RequestChangesValidationFlowVersionRequest) returns (entur.validation.v1.ValidationFlow) {
    option (google.api.http) = {post: "/validation/v1/flows/{id}/versions/{version}/request-changes"};
    option (gnostic.openapi.v3.operation) = {summary: "Send a version of a validation flow back to draft."};
    option (entur.http.v1.failure) = {
      code: "404"
      description: "No validation flow exists with the given id, or it has no such version."
    };
    option (entur.http.v1.failure) = {
      code: "403"
      description: "The caller is the author of the version."
    };
    option (entur.http.v1.failure) = {
      code: "409"
      description: "The version is not IN_REVIEW."
    };
  }

  // Start running an approved IN_REVIEW version of a validation flow next to the ACTIVE version on real deliveries. The version becomes SHADOW. Fails with 409 if the version is not IN_REVIEW or is not approved.
  rpc StartShadowValidationFlowVersion(StartShadowValidationFlowVersionRequest) returns (entur.validation.v1.ValidationFlow) {
    option (google.api.http) = {post: "/validation/v1/flows/{id}/versions/{version}/start-shadow"};
    option (gnostic.openapi.v3.operation) = {summary: "Start a shadow run of a version of a validation flow."};
    option (entur.http.v1.failure) = {
      code: "404"
      description: "No validation flow exists with the given id, or it has no such version."
    };
    option (entur.http.v1.failure) = {
      code: "409"
      description: "The version is not IN_REVIEW, or is not approved."
    };
  }

  // Stop the shadow run of a SHADOW version of a validation flow. The version becomes DRAFT again, and its shadow result and approval are cleared. Fails with 409 if the version is not SHADOW.
  rpc AbortShadowValidationFlowVersion(AbortShadowValidationFlowVersionRequest) returns (entur.validation.v1.ValidationFlow) {
    option (google.api.http) = {post: "/validation/v1/flows/{id}/versions/{version}/abort-shadow"};
    option (gnostic.openapi.v3.operation) = {summary: "Abort the shadow run of a version of a validation flow."};
    option (entur.http.v1.failure) = {
      code: "404"
      description: "No validation flow exists with the given id, or it has no such version."
    };
    option (entur.http.v1.failure) = {
      code: "409"
      description: "The version is not SHADOW."
    };
  }

  // Make an approved IN_REVIEW or SHADOW version, or a DEPRECATED one, the ACTIVE version of a validation flow. The previously ACTIVE version becomes DEPRECATED, in the same transaction, so there is never more than one. Activating a DEPRECATED version is a rollback. Fails with 409 if the version has no approval (unless DEPRECATED) or has another status.
  rpc ActivateValidationFlowVersion(ActivateValidationFlowVersionRequest) returns (entur.validation.v1.ValidationFlow) {
    option (google.api.http) = {post: "/validation/v1/flows/{id}/versions/{version}/activate"};
    option (gnostic.openapi.v3.operation) = {summary: "Activate a version of a validation flow."};
    option (entur.http.v1.failure) = {
      code: "404"
      description: "No validation flow exists with the given id, or it has no such version."
    };
    option (entur.http.v1.failure) = {
      code: "409"
      description: "The version is not approved, or is not IN_REVIEW, SHADOW or DEPRECATED."
    };
  }

  // Retire an ACTIVE or DEPRECATED version of a validation flow. A retired version never runs again. Fails with 409 if the flow is assigned to a payload type. If the retired version was ACTIVE, nothing is served for the validation flow afterwards.
  rpc RetireValidationFlowVersion(RetireValidationFlowVersionRequest) returns (entur.validation.v1.ValidationFlow) {
    option (google.api.http) = {post: "/validation/v1/flows/{id}/versions/{version}/retire"};
    option (gnostic.openapi.v3.operation) = {summary: "Retire a version of a validation flow."};
    option (entur.http.v1.failure) = {
      code: "404"
      description: "No validation flow exists with the given id, or it has no such version."
    };
    option (entur.http.v1.failure) = {
      code: "409"
      description: "The version is not ACTIVE or DEPRECATED. The flow is assigned to a payload type."
    };
  }

  // Create a new flow as a DRAFT copy of one version of a flow: the same items and pins, the
  // name suffixed " (copy)", and version 1. It is a new flow, not a new version of the same one.
  rpc CopyValidationFlowVersion(CopyValidationFlowVersionRequest) returns (entur.validation.v1.ValidationFlow) {
    option (google.api.http) = {post: "/validation/v1/flows/{id}/versions/{version}/copy"};
    option (gnostic.openapi.v3.operation) = {summary: "Copy a version of a flow as a new draft flow."};
    option (entur.http.v1.failure) = {
      code: "404"
      description: "No validation flow exists with the given id, or it has no such version."
    };
  }

  // Create or update the working DRAFT version of a flow so that every rule item pins the latest
  // ACTIVE version of its rule. Creates a draft as CreateValidationFlowVersion does when none
  // exists. Fails with 409 if the working version is IN_REVIEW or SHADOW, or if the flow has
  // no ACTIVE version and no draft.
  rpc BumpValidationFlowPins(BumpValidationFlowPinsRequest) returns (entur.validation.v1.ValidationFlow) {
    option (google.api.http) = {post: "/validation/v1/flows/{id}/bump-pins"};
    option (gnostic.openapi.v3.operation) = {summary: "Move a flow's rule pins to the latest active rule versions."};
    option (entur.http.v1.failure) = {
      code: "404"
      description: "No validation flow exists with the given id."
    };
    option (entur.http.v1.failure) = {
      code: "409"
      description: "The working version is IN_REVIEW or SHADOW, or the flow has no ACTIVE version and no draft."
    };
  }
}

// Request for ListValidationFlowVersions.
message ListValidationFlowVersionsRequest {
  // The database id of the validation flow.
  int32 id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "1"}
    }
  ];
  // The cursor to resume listing from, as returned by a previous call's cursor.
  string cursor = 2 [(gnostic.openapi.v3.property) = {
    example: {yaml: "\"eyJpZCI6NDJ9\""}
  }];
  // The maximum number of versions to return. The default page size is 100.
  optional int32 page_size = 3 [(gnostic.openapi.v3.property) = {
    example: {yaml: "20"}
  }];
}

// Response for ListValidationFlowVersions.
message ListValidationFlowVersionsResponse {
  // The versions in this page of results, newest first.
  repeated entur.validation.v1.ValidationFlow items = 1;
  // The cursor to pass to a subsequent call to continue listing. Empty
  // when there are no more results.
  string cursor = 2 [(gnostic.openapi.v3.property) = {
    example: {yaml: "\"eyJpZCI6NjJ9\""}
  }];
}

