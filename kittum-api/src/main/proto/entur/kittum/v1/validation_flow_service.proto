syntax = "proto3";

package entur.kittum.v1;

import "entur/validation/v1/enum.proto";
import "entur/validation/v1/validation_flow.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";

option go_package = "github.com/entur/validation-core/gen/entur/kittum/v1;kittumv1";
option java_multiple_files = true;
option java_package = "no.entur.kittum.proto.v1";

// The gRPC service to view and administrate flows.
service ValidationFlowService {
  option (google.api.default_host) = "kittum.entur.io";

  // List existing validation flows. The request is paginated with a default
  // page size of 20. The flows are returned shallow: their rule and
  // sub-flow items carry only the database id of what they refer to.
  rpc ListValidationFlows(ListValidationFlowsRequest) returns (ListValidationFlowsResponse) {
    option (google.api.http) = {get: "/validation/v1/flows"};
    option (gnostic.openapi.v3.operation) = {summary: "List all existing flows."};
  }

  // Get one validation flow by its id. The returned flow is deep: every
  // rule and sub-flow item it contains, recursively, carries both the
  // database id of what it refers to and the referred-to
  // ValidationRule/ValidationFlow itself. The response's `ETag`/`updated_at` reflects only
  // this flow's own shallow state - its own fields and item list, i.e. which rules/sub-flows
  // are referenced and in what order - not the content of the nested rules/sub-flows
  // themselves, since CreateValidationFlow/UpdateValidationFlow only ever write that shallow
  // state. A referenced rule or sub-flow changing therefore changes this response's content
  // without changing this flow's own `ETag`.
  rpc GetValidationFlow(GetValidationFlowRequest) returns (entur.validation.v1.ValidationFlow) {
    option (google.api.http) = {get: "/validation/v1/flows/{id}"};
    option (gnostic.openapi.v3.operation) = {summary: "Get one flow by its id."};
  }

  // Get the validation flow connected to a source, for one stage and area.
  // The returned flow is deep: every rule and sub-flow item it contains,
  // recursively, carries both the database id of what it refers to and the
  // referred-to ValidationRule/ValidationFlow itself.
  rpc GetSourceFlow(GetSourceFlowRequest) returns (entur.validation.v1.ValidationFlow) {
    option (google.api.http) = {get: "/validation/v1/sources/{source}/flows/{stage}/{area}"};
    option (gnostic.openapi.v3.operation) = {summary: "Get the flow connected to a source, for one stage and area."};
  }

  // Create a new validation flow. Every item's `rule_flow_item.id`/`sub_flow_item.id` must
  // reference an existing ValidationRule/ValidationFlow of the same `stage`; their nested
  // `validation_rule`/`flow` fields are OUTPUT_ONLY and ignored if set. The flow's `id` and
  // `updated_at` are likewise OUTPUT_ONLY and ignored if set; the server assigns both.
  // Returns the full created flow, deep as in GetValidationFlow, including its
  // server-assigned `id` and `updated_at` and those of every item it contains.
  rpc CreateValidationFlow(CreateValidationFlowRequest) returns (entur.validation.v1.ValidationFlow) {
    option (google.api.http) = {
      post: "/validation/v1/flows"
      body: "validation_flow"
    };
    option (gnostic.openapi.v3.operation) = {summary: "Create a new validation flow."};
  }

  // Update an existing validation flow. Its `id`, if set, must match the path `id`.
  // `items` is treated as a single unit: including it (or omitting the update mask entirely)
  // replaces the flow's whole item list with what is given, populated and ignored the
  // same way as in CreateValidationFlow - there is no way to patch only one item in place.
  // Returns the full updated flow, deep as in GetValidationFlow, with its new `updated_at`
  // and those of every item it contains. Over REST, this is a conditional request (RFC 7232):
  // it requires a matching `If-Match` request header and fails with 412 Precondition Failed
  // if it no longer matches the flow's current `ETag` - its own shallow state, as returned by
  // GetValidationFlow, unaffected by changes to a referenced rule or sub-flow - e.g. because
  // another update to this flow happened concurrently. This is an HTTP-layer precondition,
  // not a field of UpdateValidationFlowRequest.
  rpc UpdateValidationFlow(UpdateValidationFlowRequest) returns (entur.validation.v1.ValidationFlow) {
    option (google.api.http) = {
      patch: "/validation/v1/flows/{id}"
      body: "validation_flow"
    };
    option (gnostic.openapi.v3.operation) = {summary: "Update an existing validation flow."};
  }

  // Delete a validation flow. Over REST, this is a conditional request (RFC 7232): it
  // requires a matching `If-Match` request header and fails with 412 Precondition Failed if
  // it no longer matches the flow's current `ETag` - its own shallow state, as returned by
  // GetValidationFlow, unaffected by changes to a referenced rule or sub-flow - e.g. because
  // another update to this flow happened concurrently. This is an HTTP-layer precondition,
  // not a field of DeleteValidationFlowRequest.
  rpc DeleteValidationFlow(DeleteValidationFlowRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/validation/v1/flows/{id}"};
    option (gnostic.openapi.v3.operation) = {summary: "Delete a validation flow."};
  }
}

// Request for ListValidationFlows.
message ListValidationFlowsRequest {
  // The cursor to resume listing from, as returned by a previous call's cursor.
  string cursor = 1 [(gnostic.openapi.v3.property) = {
    example: {yaml: "\"eyJpZCI6NDJ9\""}
  }];
  // The maximum number of flows to return. The default page size is 20.
  optional int32 page_size = 2 [(gnostic.openapi.v3.property) = {
    example: {yaml: "10"}
  }];
  // A comma-separated list of fields to order by, each optionally suffixed with " desc"
  // for descending order (ascending is the default). See https://google.aip.dev/132.
  string order_by = 3 [(gnostic.openapi.v3.property) = {
    example: {yaml: "\"name\""}
  }];
}

// Response for ListValidationFlows.
message ListValidationFlowsResponse {
  // The (shallow) flows in this page of results.
  repeated entur.validation.v1.ValidationFlow items = 1;
  // The cursor to pass to a subsequent call to continue listing. Empty
  // when there are no more results.
  string cursor = 2 [(gnostic.openapi.v3.property) = {
    example: {yaml: "\"eyJpZCI6NjJ9\""}
  }];
}

// Request for GetValidationFlow.
message GetValidationFlowRequest {
  // The database id of the flow to lookup.
  int32 id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "1"}
    }
  ];
}

// Request for GetSourceFlow.
message GetSourceFlowRequest {
  // The name of the source to lookup.
  string source = 1 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "\"rutedata\""}
    }
  ];
  // The stage of the flow to lookup.
  //
  // This field is case insensitive.
  entur.validation.v1.ValidationStage stage = 2 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "\"STRUCTURAL\""}
    }
  ];
  // The name of the area to lookup.
  string area = 3 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "\"Personalisering\""}
    }
  ];
}

// Request for CreateValidationFlow.
message CreateValidationFlowRequest {
  // The validation flow to create.
  entur.validation.v1.ValidationFlow validation_flow = 1 [(google.api.field_behavior) = REQUIRED];
}

// Request for UpdateValidationFlow.
message UpdateValidationFlowRequest {
  // The database id of the validation flow to update.
  int32 id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "1"}
    }
  ];
  // The flow's new field values.
  entur.validation.v1.ValidationFlow validation_flow = 2 [(google.api.field_behavior) = REQUIRED];
  // The fields of `validation_flow` to update. Fields populated in `validation_flow` but not
  // listed here are left unchanged. Omitting this mask updates every field populated in
  // `validation_flow`.
  optional google.protobuf.FieldMask update_mask = 3;
}

// Request for DeleteValidationFlow.
message DeleteValidationFlowRequest {
  // The database id of the validation flow to delete.
  int32 id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "1"}
    }
  ];
}
