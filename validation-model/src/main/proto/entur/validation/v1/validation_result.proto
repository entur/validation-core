syntax = "proto3";

package entur.validation.v1;

import "entur/validation/v1/enum.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/entur/validation-core/gen/entur/validation/v1;validationv1";
option java_multiple_files = true;
option java_package = "no.entur.validation.proto.v1";

// The outcome of running a validation rule against a delivery.
message ValidationResult {
  // The id of the validation rule that produced this result.
  int32 validation_rule_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "1"}
    }
  ];

  // The id of the delivery that was validated.
  int32 delivery_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "1"}
    }
  ];

  // When the validation run started.
  google.protobuf.Timestamp start_time = 3 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "\"2024-01-01T00:00:00Z\""}
    }
  ];

  // When the validation run finished.
  google.protobuf.Timestamp end_time = 4 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "\"2024-01-01T00:00:00Z\""}
    }
  ];

  // The individual findings produced by this validation run.
  repeated Message messages = 6 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "[{\"message\": \"This is a message.\", \"severity\": \"ERROR\", \"location_details\": [{\"file_name\": \"file1.txt\", \"line_number\": 10, \"column_number\": 5}]}]"}
    }
  ];

  // Whether the delivery passed validation, i.e. no message has a blocking severity.
  bool success = 7 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "true"}
    }
  ];

  // Whether this result is incomplete.
  bool incomplete = 8 [(gnostic.openapi.v3.property) = {
    description: "Whether this result is incomplete because the full set of findings was too large to fit in this Kafka message. When true, `messages` only contains a partial view and the complete result can be retrieved from `full_result_url`."
    example: {yaml: "false"}
  }];

  // Where the complete, untruncated result can be retrieved, e.g. a GCS object URL.
  // Only set when `incomplete` is true.
  optional string full_result_url = 9 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "\"https://storage.googleapis.com/validation-results/2026/09/25/abc123.json\""}
    }
  ];
}

// A single finding raised while validating a delivery.
message Message {
  // A human-readable description of the finding.
  string message = 1 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "\"This is a message.\""}
    }
  ];

  // How severely this finding should be treated.
  Severity severity = 3 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "\"ERROR\""}
    }
  ];

  // Where in the delivery this finding applies, if known.
  repeated Location location_details = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "[{\"file_name\": \"file1.txt\", \"line_number\": 10, \"column_number\": 5}]"}
    }
  ];
}

// A pointer to a specific place in a file, e.g. where a Message applies.
message Location {
  // The name of the file this location refers to.
  string file_name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "\"file1.txt\""}
    }
  ];
  // The line number within the file, if applicable.
  optional int32 line_number = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "10"}
    }
  ];
  // The column number within the line, if applicable.
  optional int32 column_number = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "5"}
    }
  ];
}
