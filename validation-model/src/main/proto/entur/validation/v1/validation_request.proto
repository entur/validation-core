syntax = "proto3";

package entur.validation.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/entur/validation-core/gen/entur/validation/v1;validationv1";
option java_multiple_files = true;
option java_package = "no.entur.validation.proto.v1";

// A request to start validating an imported dataset, published on the
// validation-request Kafka topic. Every validation stage runs unless its flag
// is explicitly set to false; an unset flag means true.
message ValidationRequest {
  // Where the files to validate are stored, e.g. a GCS object URI.
  string original_dataset_uri = 1 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "\"gs://validation-imports/rutedata/2026/10/13/abc123.zip\""}
    }
  ];

  // The key identifying the import this dataset came from.
  string import_key = 2 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "\"abc123\""}
    }
  ];

  // When the dataset was imported.
  google.protobuf.Timestamp import_date_time = 3 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "\"2026-10-13T00:00:00Z\""}
    }
  ];

  // The system that sent this request, e.g. the import pipeline or the admin
  // tool.
  string requested_by = 4 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "\"admin-tool\""}
    }
  ];

  // Whether to run the STRUCTURAL validation stage. Unset means true.
  optional bool structure = 5 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "Whether to run the STRUCTURAL validation stage. Unset means true; set to false to skip the stage."
      example: {yaml: "true"}
    }
  ];

  // Whether to run the LOCAL validation stage. Unset means true.
  optional bool local = 6 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "Whether to run the LOCAL validation stage. Unset means true; set to false to skip the stage."
      example: {yaml: "true"}
    }
  ];

  // Whether to run the GLOBAL validation stage. Unset means true.
  optional bool global = 7 [
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "Whether to run the GLOBAL validation stage. Unset means true; set to false to skip the stage."
      example: {yaml: "true"}
    }
  ];
}
