syntax = "proto3";

package entur.validation.v1;

import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

option java_package = "no.entur.validation.proto.v1";
option java_multiple_files = true;
option go_package = "github.com/entur/validation-core/gen/entur/validation/v1;validationv1";

// An owner of deliveries and areas, for example an Entur team.
message Owner {
  // The id of the owner.
  int64 id = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The name of the owner.
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  // The timestamp of the owner.
  google.protobuf.Timestamp updated_at = 100;
}
