syntax = "proto3";

package entur.validation.v1;

option go_package = "github.com/entur/validation-core/gen/entur/validation/v1;validationv1";
option java_multiple_files = true;
option java_package = "no.entur.validation.proto.v1";

// How severely a validation rule's failure should be treated.
enum Severity {
  // Unspecified severity. This is an invalid value.
  SEVERITY_UNSPECIFIED = 0;
  // Blocks further parsing or processing of the data outright.
  CRITICAL = 1;
  // Blocks the dataset, e.g. duplicate ids, invalid or missing data.
  ERROR = 2;
  // Non-blocking: suspicious data, data that will become an ERROR later, or that is ignored/redefined.
  WARNING = 3;
  // Informational only, e.g. missing recommended data or a future WARNING.
  INFO = 4;
}

// A validation stage a rule or flow applies to.
enum ValidationStage {
  // Unspecified validation stage. This is an invalid value.
  VALIDATION_STAGE_UNSPECIFIED = 0;
  // Validates a file's structure, e.g. against an XSD, before any other stage runs.
  STRUCTURAL = 1;
  // Checks a file against only its own, local data context.
  LOCAL = 2;
  // Cross-validates a file against other data, e.g. references and integrity across the dataset.
  GLOBAL = 3;
}
