syntax = "proto3";

package entur.validation.v1;

option go_package = "github.com/entur/validation-core/gen/entur/validation/v1;validationv1";
option java_multiple_files = true;
option java_package = "no.entur.validation.proto.v1";

// How severely a validation rule's failure should be treated.
enum Severity {
  // Unspecified severity. This is an invalid value.
  SEVERITY_UNSPECIFIED = 0;
  // Blocks further parsing or processing of the data outright.
  CRITICAL = 1;
  // Blocks the dataset, e.g. duplicate ids, invalid or missing data.
  ERROR = 2;
  // Non-blocking: suspicious data, data that will become an ERROR later, or that is ignored/redefined.
  WARNING = 3;
  // Informational only, e.g. missing recommended data or a future WARNING.
  INFO = 4;
}

// A validation stage a rule or flow applies to.
enum ValidationStage {
  // Unspecified validation stage. This is an invalid value.
  VALIDATION_STAGE_UNSPECIFIED = 0;
  // Validates a file's structure, e.g. against an XSD, before any other stage runs.
  STRUCTURAL = 1;
  // Checks a file against only its own, local data context.
  LOCAL = 2;
  // Cross-validates a file against other data, e.g. references and integrity across the dataset.
  GLOBAL = 3;
}

// Various cardinalities for existence of fields or values.
enum Cardinality {
  // Unspecified cardinality. This is an invalid value.
  CARDINALITY_UNSPECIFIED = 0;
  // The specified field should _not_ exist.
  NONE = 1;
  // The specified field should exist exactly once.
  EXACTLY_ONE = 2;
  // The specified field should exist at least once.
  AT_LEAST_ONE = 3;
  // The specified field should exist exactly twice.
  EXACTLY_TWO = 4;
}

// Where a version of a validation rule or flow is in its lifecycle. A version moves
// DRAFT, IN_REVIEW, SHADOW, ACTIVE, DEPRECATED, RETIRED. At most one version of a rule
// or flow is ACTIVE at a time.
enum VersionStatus {
  // Unspecified version status. This is an invalid value.
  VERSION_STATUS_UNSPECIFIED = 0;
  // Being edited. The only status whose content can change.
  DRAFT = 1;
  // Submitted and frozen, waiting for approval. Approval by someone other than the author is
  // recorded in `VersionInfo.approved_by` and does not change the status.
  IN_REVIEW = 2;
  // Approved and running next to the ACTIVE version on real deliveries, with its findings kept
  // separate from the ACTIVE version's. Every version passes through SHADOW before it is first
  // activated. Frozen.
  SHADOW = 3;
  // The version that is served. Frozen.
  ACTIVE = 4;
  // Replaced by a newer ACTIVE version. Can be activated again, which is a rollback.
  DEPRECATED = 5;
  // Never runs again. Terminal.
  RETIRED = 6;
}
