syntax = "proto3";

package entur.validation.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/entur/validation-core/gen/entur/validation/v1;validationv1";
option java_multiple_files = true;
option java_package = "no.entur.validation.proto.v1";

// A named intake point for a set of files, owned by exactly one Owner.
message Source {
  // The database id of the source.
  int32 id = 1 [
    (google.api.field_behavior) = IDENTIFIER,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "42"}
    }
  ];
  // The name of the source.
  string name = 2 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "\"rutedata\""}
    }
  ];
  // The database id of the owner of the source.
  int32 owner = 3 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "3"}
    }
  ];

  // The timestamp the source was last updated. Always populated by the server; a value set
  // by the client is ignored, not an error.
  google.protobuf.Timestamp updated_at = 100 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "\"2026-01-01T00:00:00Z\""}
    }
  ];
}
