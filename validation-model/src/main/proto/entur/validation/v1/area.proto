syntax = "proto3";

package entur.validation.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/entur/validation-core/gen/entur/validation/v1;validationv1";
option java_multiple_files = true;
option java_package = "no.entur.validation.proto.v1";

// A specific area that is interested in validating certain deliveries. Owned by exactly one Owner.
message Area {
  // The database id of the area.
  int32 id = 1 [
    (google.api.field_behavior) = IDENTIFIER,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "1"}
    }
  ];
  // The name of the area.
  string name = 2 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "\"Personalisering\""}
    }
  ];
  // The database id of the owner of the area.
  int32 owner = 3 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "2"}
    }
  ];
  // The timestamp the area was last updated. Always populated by the server; a value set by
  // the client is ignored, not an error.
  google.protobuf.Timestamp updated_at = 100 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "\"2026-01-01T00:00:00Z\""}
    }
  ];
}
