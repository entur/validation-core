syntax = "proto3";

package entur.validation.v1;

import "entur/validation/v1/enum.proto";
import "entur/validation/v1/validation_data.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/entur/validation-core/gen/entur/validation/v1;validationv1";
option java_multiple_files = true;
option java_package = "no.entur.validation.proto.v1";

// A delivery of data submitted for validation.
message ValidationDelivery {
  // Unique across all deliveries and used in the delivery's URL, so it must be
  // a valid URL path segment.
  string key = 1;

  // The payload type, e.g. "rutedata" or "produktdata".
  string payload_type = 2;

  // Free-form labels, e.g. the responsible transport operator or data provider.
  map<string, string> tags = 3;

  // Where the files to validate are stored.
  ValidationData data = 4;

  // VALIDATION_STAGE_UNSPECIFIED is invalid.
  ValidationStage stage = 5 [(google.api.field_behavior) = REQUIRED];

  // Set by the server; a value set by the client is ignored, not an error.
  google.protobuf.Timestamp requested_at = 100;
}
