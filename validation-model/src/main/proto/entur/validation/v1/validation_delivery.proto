syntax = "proto3";

package entur.validation.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/entur/validation-core/gen/entur/validation/v1;validationv1";
option java_multiple_files = true;
option java_package = "no.entur.validation.proto.v1";

// A validation delivery is a delivery of data submitted for validation.
message ValidationDelivery {
  // The key of the validation delivery, unique across all validation deliveries. The key is used to
  // identify the delivery throughout the validation system, and is used in the URL of the delivery.
  // The key must be a valid URL path segment, and must not contain any characters that are not
  // allowed in a URL path segment.
  string key = 1;

  // The type of payload the validation delivery contains, e.g. "rutedata" or "produktdata".
  string payload_type = 2;

  // Free-form key/value labels attached to the delivery, e.g. the participant responsible for it
  // such as a transport operator or a data provider.
  map<string, string> tags = 3;

  // The location of the delivery, e.g. a URL to a zip file.
  string location = 4;

  // The timestamp the validation delivery was initiated. Always populated by the server; a
  // value set by the client is ignored, not an error.
  google.protobuf.Timestamp requested_at = 100;
}
