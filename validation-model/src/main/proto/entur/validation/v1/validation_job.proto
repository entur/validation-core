syntax = "proto3";

package entur.validation.v1;

import "entur/validation/v1/enum.proto";
import "entur/validation/v1/validation_progress.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/entur/validation-core/gen/entur/validation/v1;validationv1";
option java_multiple_files = true;
option java_package = "no.entur.validation.proto.v1";

// A single validation job: the aggregated outcome of validating one delivery's one stage, built
// up from the ValidationProgress messages received for it so far.
message ValidationJob {
  // The unique id of this job (ValidationDelivery.validation_job_uuid / ValidationProgress.validation_job_uuid).
  string validation_job_uuid = 1;
  // The single stage this job validates.
  ValidationStage stage = 2;
  // True once every rule in this stage has either completed or been skipped.
  bool is_complete = 3;
  // Whether every finding recorded so far for this job is below a blocking severity
  // (CRITICAL/ERROR). Unset until the first rule result arrives.
  optional bool overall_success = 4;
  // The most severe severity seen across every finding under this job so far. Unset until a
  // finding has been recorded.
  optional Severity worst_severity = 5;
  // The stage's rule counts from the most recently received progress.
  int32 total_rules = 6;
  // The number of completed rules.
  int32 completed_rules = 7;
  // The number of skipped rules.
  int32 skipped_rules = 8;
  // When the first progress for this job was received.
  google.protobuf.Timestamp first_progress_received_at = 9;
  // When the most recent progress for this job was received.
  google.protobuf.Timestamp last_progress_received_at = 10;
  // Dataset-wide findings, with no particular rule to attribute them to. Expected to be few and
  // small; a rule-attributed finding is instead found on its own RuleResult (see ListResults).
  repeated Message findings = 11;
}
