version: v2
plugins:
  # See validation-model/buf.gen.yaml for why protoc_builtin is used here
  # instead of a standalone plugin binary. Test-fixtures only (src/test/proto)
  # - listed in the root buf.yaml workspace with a pared-down lint/breaking
  # override, not treated as a published contract like the other modules'
  # src/main/proto - see entur.test-proto-module.gradle.kts's own KDoc.
  - protoc_builtin: java
    protoc_path: protoc
    out: exposed-utils/build/generated/source/proto/test/java
  - protoc_builtin: kotlin
    protoc_path: protoc
    out: exposed-utils/build/generated/source/proto/test/kotlin
