[versions]
kotlin = "2.4.21"
protobuf = "4.36.2"
proto-google-common-protos = "2.79.0"
# Only the hand-written modules need this stack: the Spring Boot BOM (api-utils, exposed-utils,
# kafka-utils), Exposed and coroutines (exposed-utils) and ktlint (all four) - the schema modules are
# plain protobuf message/schema libraries. Kept aligned with the team-validering services' own catalogs.
springBoot = "4.1.2"
exposed = "1.6.0"
kotlinxCoroutines = "1.11.0"
ktlintPlugin = "14.2.0"
ktlint = "1.8.0"
# Only api-utils needs this. Kept aligned with the catalogs of the team-validering services that use it.
oidcAuthResourceServer = "3.0.5"
# Only kafka-utils needs this (compileOnly). Kept aligned with the Confluent serdes its consumers
# use. NOT 8.4.0: its classes call org.apache.kafka.common.utils.internals.ByteUtils, which
# doesn't exist in kafka-clients 4.2.2.
confluent = "8.3.2"
# Only gcs-utils needs this. Kept aligned with the team-validering services' own catalogs.
googleCloudStorage = "2.76.0"

[libraries]
protobuf-java = { group = "com.google.protobuf", name = "protobuf-java", version.ref = "protobuf" }
protobuf-kotlin = { group = "com.google.protobuf", name = "protobuf-kotlin", version.ref = "protobuf" }
protobuf-java-util = { group = "com.google.protobuf", name = "protobuf-java-util", version.ref = "protobuf" }
proto-google-common-protos = { group = "com.google.api.grpc", name = "proto-google-common-protos", version.ref = "proto-google-common-protos" }
kotlin-bom = { module = "org.jetbrains.kotlin:kotlin-bom", version.ref = "kotlin" }
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
exposed-bom = { module = "org.jetbrains.exposed:exposed-bom", version.ref = "exposed" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core" }
exposed-r2dbc = { module = "org.jetbrains.exposed:exposed-r2dbc" }
exposed-java-time = { module = "org.jetbrains.exposed:exposed-java-time" }
kotlinx-coroutines-bom = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-bom", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
entur-oidc-rs-webflux-config = { module = "org.entur.auth.resource-server:oidc-rs-spring-boot-webflux-config", version.ref = "oidcAuthResourceServer" }
google-cloud-storage = { module = "com.google.cloud:google-cloud-storage", version.ref = "googleCloudStorage" }
kafka-schema-registry-client = { module = "io.confluent:kafka-schema-registry-client", version.ref = "confluent" }
kafka-schema-serializer = { module = "io.confluent:kafka-schema-serializer", version.ref = "confluent" }
kafka-protobuf-provider = { module = "io.confluent:kafka-protobuf-provider", version.ref = "confluent" }

[bundles]
protobuf = ["protobuf-java", "protobuf-kotlin", "protobuf-java-util", "proto-google-common-protos"]

[plugins]
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
