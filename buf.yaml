version: v2
lint:
  use:
    - STANDARD
    - COMMENTS
    - UNARY_RPC
  except:
    # Enum values are frequently used in API URLs, and buf's idiomatic enum type prefix would
    # make them longer than necessary
    - ENUM_VALUE_PREFIX
    # Simple get RPCs are allowed to return simple data objects.
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
modules:
  - path: http-model/src/main/proto
  - path: validation-model/src/main/proto
  - path: kittum-api/src/main/proto
deps:
  - buf.build/googleapis/googleapis
  - buf.build/gnostic/gnostic
breaking:
  use: [FILE]
