syntax = "proto3";

package mock;

import "entur/http/v1/failure.proto";

// Exists purely so OpenApiFailureAugmenterTest can check that a rpc declaring the same failure
// code twice is rejected, without polluting service.proto's fixture (which the other tests
// assert an exact, duplicate-free set of responses against).

message DeleteThingRequest {}

message Thing {}

service DuplicateFailureService {
  rpc DeleteThing(DeleteThingRequest) returns (Thing) {
    option (entur.http.v1.failure) = {code: "404" description: "Thing not found."};
    option (entur.http.v1.failure) = {code: "404" description: "Thing already deleted."};
  }
}
