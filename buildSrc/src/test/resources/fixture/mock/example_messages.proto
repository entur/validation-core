syntax = "proto3";

package mock;

import "gnostic/openapi/v3/annotations.proto";

// A minimal message tree purely to exercise OpenApiExampleAugmenter: a field with a declared
// example, a field without one, a singular and a repeated message-typed field to recurse
// through, and a pair of messages that reference each other so the augmenter's cycle-breaking
// can be exercised too. See OpenApiExampleAugmenterTest.

message Leaf {
  string name = 1 [(gnostic.openapi.v3.property) = {example: {yaml: "\"leaf\""}}];
  // Deliberately undeclared - OpenApiExampleAugmenterTest checks this is left out of the
  // synthesized example rather than e.g. rendered as null.
  string unannotated = 2;
}

message Wrapper {
  Leaf leaf = 1;
  repeated Leaf leaves = 2;
}

message CycleA {
  CycleB b = 1;
}

message CycleB {
  CycleA a = 1;
}

// Mirrors FlowItem's rule_flow_item/sub_flow_item oneof: two mutually exclusive alternatives,
// each with its own declared example, plus a field before and after the oneof.
message WithOneof {
  int32 id = 1 [(gnostic.openapi.v3.property) = {example: {yaml: "1"}}];
  oneof choice {
    string first_choice = 2 [(gnostic.openapi.v3.property) = {example: {yaml: "\"first\""}}];
    string second_choice = 3 [(gnostic.openapi.v3.property) = {example: {yaml: "\"second\""}}];
  }
  string trailing = 4 [(gnostic.openapi.v3.property) = {example: {yaml: "\"trailing\""}}];
}
