syntax = "proto3";

package entur.ishum.v1;

import "entur/http/v1/failure.proto";
import "entur/validation/v1/validation_data.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";

option go_package = "github.com/entur/validation-core/gen/entur/ishum/v1;ishumv1";
option java_multiple_files = true;
option java_package = "no.entur.ishum.proto.v1";

// The gRPC service to view the data ishum has seen and where each delivery is stored.
service ValidationDataService {
  option (google.api.default_host) = "ishum.entur.io";

  // List validation data.
  //
  // The request is paginated with a default page size of 100.
  rpc ListValidationData(ListValidationDataRequest) returns (ListValidationDataResponse) {
    option (google.api.http) = {get: "/validation/v1/validation-data"};
    option (gnostic.openapi.v3.operation) = {summary: "List validation data."};
  }

  // Get one validation data by its external id.
  rpc GetValidationData(GetValidationDataRequest) returns (entur.validation.v1.ValidationData) {
    option (google.api.http) = {get: "/validation/v1/validation-data/{external_id}"};
    option (gnostic.openapi.v3.operation) = {summary: "Get one validation data by its external id."};
    option (entur.http.v1.failure) = {
      code: "404"
      description: "No validation data exists with the given external id."
    };
  }
}

// Request for ListValidationData.
message ListValidationDataRequest {
  // The cursor to resume listing from, as returned by a previous call's cursor.
  string cursor = 1 [(gnostic.openapi.v3.property) = {
    example: {yaml: "\"eyJpZCI6NDJ9\""}
  }];
  // The maximum number of validation data to return. The default page size is 100.
  optional int32 page_size = 2 [(gnostic.openapi.v3.property) = {
    example: {yaml: "20"}
  }];
  // A comma-separated list of fields to order by, each optionally suffixed with " desc"
  // for descending order (ascending is the default). See https://google.aip.dev/132. Field names
  // are camelCase, e.g. "importDateTime desc", not the proto's own snake_case field names.
  // Supported fields: importDateTime (the default, desc), externalId, originator, payloadType.
  string order_by = 3 [(gnostic.openapi.v3.property) = {
    example: {yaml: "\"importDateTime desc\""}
  }];
  // Only return data from this originator. Unset returns data from every originator.
  optional string originator = 4 [(gnostic.openapi.v3.property) = {
    example: {yaml: "\"RUT\""}
  }];
}

// Response for ListValidationData.
message ListValidationDataResponse {
  // The validation data in this page of results.
  repeated entur.validation.v1.ValidationData items = 1;
  // The cursor to pass to a subsequent call to continue listing. Empty
  // when there are no more results.
  string cursor = 2 [(gnostic.openapi.v3.property) = {
    example: {yaml: "\"eyJpZCI6NjJ9\""}
  }];
}

// Request for GetValidationData.
message GetValidationDataRequest {
  // The external id of the validation data to look up.
  string external_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "\"b6e43c3a-2e3e-4c5a-8f1a-2f6a6e1c9d3b\""}
    }
  ];
}
